name: Solar CI

on:
  pull_request:
    branches:
      - main
      - pkg/migration
      - openJiuwen-Solar
  push:
    branches:
      - main
      - pkg/migration
      - openJiuwen-Solar
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: read

concurrency:
  group: solar-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository-safety test dependency
        run: python -m pip install pytest

      - name: Reject tracked local and generated state
        run: bash scripts/check-repo-hygiene.sh

      - name: Verify hygiene gate negative controls
        run: bash tests/repository/governance/test_repo_hygiene.sh

      - name: Enforce safe staging on changed paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            merge_base="$(git merge-base HEAD "${{ github.event.pull_request.base.sha }}")"
            python scripts/check-safe-staging.py --diff-base "$merge_base"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              python scripts/check-safe-staging.py --all-tracked
            else
              python scripts/check-safe-staging.py --diff-base "$before"
            fi
          else
            python scripts/check-safe-staging.py --all-tracked
          fi

      - name: Enforce secret and Windows filename gates
        run: |
          python scripts/check-secret-scan.py
          python scripts/check-windows-filenames.py

      - name: Verify repository safety fixtures
        run: |
          python -m pytest -q \
            tests/repository/governance/test_safe_staging.py \
            tests/repository/governance/test_secret_scan.py \
            tests/repository/governance/test_windows_filenames.py \
            tests/harness/research_orchestration/test_sandbox_fallback_matrix.py

  python-smoke:
    name: Python smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests pyyaml beautifulsoup4 jsonschema

      - name: Syntax check critical runtime files
        run: |
          python -m py_compile \
            harness/lib/graph_node_dispatcher.py \
            harness/lib/symphony/status-server.py \
            harness/scripts/tech_hotspot_radar.py

      - name: Run graph and dispatch smoke tests
        env:
          SOLAR_GRAPH_BUILDER_OPERATOR_POOL: "0"
        run: |
          python -m pytest -q \
            tests/harness/graph/test_pm_inbox_closeout_reconcile.py \
            tests/harness/graph/test_graph_status_sync.py \
            tests/harness/graph/test_parent_ready_closeout.py \
            tests/harness/graph/test_task_graph_state_io.py \
            tests/harness/graph/test_graph_dispatch_lease_busy.py \
            tests/harness/graph/test_graph_dispatch_submit.py \
            tests/harness/graph/test_worker_assignment_reasons.py \
            tests/harness/test_eval_verdict_evidence_gate_wiring.py \
            tests/harness/test_pm_dispatch.py

  hf-ai-influence-smoke:
    name: HF and AI Influence smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests pyyaml beautifulsoup4 jsonschema

      - name: Run HF and report center smoke tests
        run: |
          python -m pytest -q \
            tests/harness/test_tech_hotspot_browser_agent_cmd.py \
            tests/harness/test_hf_paper_insight_runtime.py \
            tests/harness/test_hf_paper_insight_schema.py \
            tests/harness/test_hf_paper_insight_scoring.py \
            tests/harness/test_ai_influence_status_server.py
          python tests/harness/test_status_server_ai_influence.py

  harness-shell-smoke:
    name: Harness shell smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests pyyaml beautifulsoup4 jsonschema

      - name: Run shell smoke tests
        env:
          SOLAR_GRAPH_BUILDER_OPERATOR_POOL: "0"
        run: |
          bash tests/harness/test_autopilot_prereq_dict.sh
          bash tests/harness/test_coordinator_dispatch_template_escaping.sh
          bash tests/harness/test_graph_dispatch_pane_role_guard.sh
          bash tests/harness/test_multi_task_entrypoint.sh
          bash tests/harness/test_pm_planner_html_artifacts.sh
          bash scripts/check-harness-plumbing.sh
          bash scripts/check-solar-ui-lite.sh

  autosci-premerge-gate:
    name: AutoSci premerge gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: harness
      SOLAR_GRAPH_BUILDER_OPERATOR_POOL: "0"
      AUTOSCI_DISABLE_NETWORK_FETCH: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests pyyaml beautifulsoup4 jsonschema

      - name: Run AutoSci premerge gate
        run: |
          bash tests/harness/test_autosci_premerge_gate.sh

  verification-release-gate:
    name: Verification release gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: harness
      SOLAR_GRAPH_BUILDER_OPERATOR_POOL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests pyyaml beautifulsoup4 jsonschema

      - name: Run evaluator and closeout gate tests
        run: |
          python -m pytest -q \
            tests/harness/graph/test_acceptance_closeout.py \
            tests/harness/graph/test_node_proof_obligations.py \
            tests/harness/graph/test_evaluation_plan_dispatch.py \
            tests/harness/graph/test_evaluator_pool_discovery.py \
            tests/harness/runtime/test_verification_gate.py \
            tests/harness/test_compile_eval.py \
            tests/harness/test_compiled_sprint_review_closeout.py \
            tests/harness/test_hf_s05_verification_release_closeout.py \
            tests/harness/test_thunderomlx_kvtc_s05_closeout.py \
            tests/harness/research_unit/test_evaluator.py \
            tests/harness/research_unit/test_cli.py \
            tests/harness/research_survey/test_survey_evaluator.py

  release-packaging-smoke:
    name: Release packaging smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HARNESS_DIR: ${{ github.workspace }}/harness
    defaults:
      run:
        working-directory: harness
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Run release packaging smoke
        run: |
          bash -n release/build.sh
          bash -n release/publish.sh
          test -f VERSION
          test -f release/CHANGELOG.md
          grep -q "S7" release/CHANGELOG.md
          test -f docs/upgrade-guide.md
          test -f docs/rollback-guide.md
          for n in 001 002 003 004 005; do
            ls ADR/ADR-${n}-*.md >/dev/null
          done
          set +e
          dry_run_output="$(bash release/build.sh --dry-run 2>&1)"
          dry_run_rc=$?
          set -e
          echo "$dry_run_output"
          test "$dry_run_rc" -ge 0
          echo "$dry_run_output" | grep -q "would create"
          echo "$dry_run_output" | grep -q "Exclusions"
          python - <<'PY'
          import json
          import subprocess
          import sys
          result = subprocess.run(
              [sys.executable, "lib/plugin_loader.py", "validate", "--json"],
              check=True,
              capture_output=True,
              text=True,
          )
          payload = json.loads(result.stdout)
          assert payload.get("ok") is True, payload
          PY
          python -m py_compile lib/plugin_loader.py lib/graph_scheduler.py lib/graph_node_dispatcher.py
