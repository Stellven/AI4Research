name: install-matrix

on:
  push:
    branches:
      - pkg/migration
  pull_request:
  workflow_dispatch:

jobs:
  core-static:
    name: core import resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check core import resolution
        run: ./scripts/check-core-imports.sh

  kernel-gen:
    name: kernel-gen check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check kernel assemblies are clean
        run: ./scripts/check-kernel-gen.sh

      - name: Check daemon templates render clean
        run: ./scripts/check-daemons-render.sh

  ps1-lint:
    name: install.ps1 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Error,Warning
          $issues | Format-Table -AutoSize
          if ($issues.Count -gt 0) {
            Write-Error "PSScriptAnalyzer found $($issues.Count) issue(s)"
            exit 1
          }
          Write-Host "install.ps1 lint clean"

  install:
    name: ${{ matrix.os }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        profile:
          - minimal
          - full-non-rust

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        if: matrix.profile == 'full-non-rust'
        with:
          bun-version: latest

      - name: Pin bash to /bin/bash on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/system-bash/bash"
          echo "$RUNNER_TEMP/system-bash" >> "$GITHUB_PATH"

      - name: Assert macOS leg runs system bash 3.2
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "bash resolves to: $(command -v bash)"
          echo "BASH_VERSION=$BASH_VERSION"
          case "$BASH_VERSION" in
            3.2.*) echo "confirmed macOS system bash 3.2" ;;
            *)
              echo "expected /bin/bash 3.2 on the macOS leg, got: $BASH_VERSION" >&2
              exit 1
              ;;
          esac

      - name: Install and uninstall smoke
        shell: bash
        run: |
          status=0
          ./scripts/smoke-install-matrix.sh "${{ matrix.profile }}" 2>&1 | tee "$RUNNER_TEMP/smoke.log" || status=$?
          if [ "$status" -ne 0 ]; then
            # Surface the failure tail as a check-run annotation: job logs
            # need admin rights on this fork, annotations are public.
            tail -c 6000 "$RUNNER_TEMP/smoke.log" | python3 -c 'import sys; data = sys.stdin.read(); print("::error title=smoke failure tail::" + data.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit "$status"
          fi
          # Positive evidence: emit the gate lines as a public notice
          # annotation so success is verifiable without log access.
          grep -E 'smoke profile passed|db schema assertions passed|config.env rendered|settings hook registration|daemon socket gate|dashboard http gate|install complete' "$RUNNER_TEMP/smoke.log" | python3 -c 'import sys; data = sys.stdin.read(); print("::notice title=smoke evidence::" + data.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
