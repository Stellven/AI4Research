capability_capsule_id: cap.phase0-claim-verification
version: 0.1.0
capsule_kind: capability
metadata:
  name: Phase 0 Claim Verification
  description: Verify paper claims by extracting benchmark claims, generating contracts, replaying or running evidence, and producing evidence-backed verdicts.
applicability:
  task_types:
    - research
    - verification
    - benchmark
    - evidence
  positive_signals:
    - paper
    - claim
    - verification
    - reproduction
    - benchmark
  negative_signals:
    - pure-implementation
    - auto-merge
contract:
  inputs:
    required:
      - name: verification_request
        type: json
      - name: paper_source
        type: document
      - name: repo_source
        type: repo
    optional:
      - name: prior_phase0_artifacts
        type: artifact_bundle
      - name: run_budget
        type: json
  outputs:
    required:
      - name: paper_claims
        type: json
      - name: benchmark_contracts
        type: json
      - name: claim_comparison
        type: json
      - name: phase0_verification_summary
        type: json
      - name: phase0_verification_report
        type: markdown
      - name: eval_json
        type: json
    optional:
      - name: benchmark_run_result
        type: json
      - name: parsed_observed_results
        type: json
      - name: evidence_map
        type: json
  preconditions:
    - check: task_type_in
      values:
        - research
        - verification
        - benchmark
        - evidence
  postconditions:
    - check: output_present
      field: phase0_verification_summary
    - check: output_present
      field: phase0_verification_report
    - check: output_present
      field: eval_json
  invariants:
    - claim_verdict_status and execution_readiness_status must remain separate.
    - Do not mark reproduced, partially_reproduced, or not_reproduced without explicit observed metric or artifact-inspection evidence.
    - Execution readiness cannot upgrade a claim verdict.
    - Reconstructed paths support at most partially_reproduced unless paper-equivalent execution is proven.
composition:
  consumes:
    - type: artifact.paper_source
    - type: artifact.repo_source
    - type: artifact.prior_phase0_artifacts
  produces:
    - type: artifact.paper_claims
    - type: artifact.benchmark_contracts
    - type: artifact.benchmark_run_result
    - type: artifact.claim_comparison
    - type: artifact.phase0_verification_summary
    - type: artifact.phase0_verification_report
  compatible_with:
    - guard.secret-leak-guard
    - resource.github-readonly
    - resource.repo-workspace
  incompatible_with:
    - cap.auto-merge-without-review
  requires_after:
    - guard.secret-leak-guard
effects:
  read:
    - repo.read
    - paper.read
    - artifacts.read
  write:
    - artifacts.phase0
    - artifacts.eval
  execute:
    - shell.benchmark
    - shell.pytest
  network:
    - optional.provider_api
  cost:
    - benchmark_model_quota
  risk:
    - false_reproduction_claim
    - provider_cost_overrun
bindings:
  skills:
    required: []
    optional:
      - skill.research-claim-extraction
      - skill.benchmark-contract-writing
      - skill.phase0-reporting
  mcp_capabilities: {}
  data_refs:
    - data.paper_source
    - data.repo_source
    - data.prior_phase0_artifacts
  secret_refs:
    - optional.openai_api_key
    - optional.openrouter_api_key
  required_guard_capsules:
    - guard.secret-leak-guard
  required_resource_capsules:
    - resource.github-readonly
    - resource.repo-workspace
verification:
  self_check:
    - check.schemas_valid
    - check.verdicts_have_evidence
    - check.readiness_does_not_upgrade_verdict
    - check.golden_fixture_preserved
  external_verifier:
    required: true
    preferred_capsules:
      - guard.secret-leak-guard
  pass_conditions:
    - phase0_verification_summary exists
    - phase0_verification_report exists
    - eval_json exists
    - no reproduced/partially_reproduced/not_reproduced verdict lacks evidence ids
operator_compatibility:
  preferred:
    - ResearchClaimVerifier
    - BenchmarkRunner
    - VerifierLite
    - Verifier
  forbidden: []
provenance:
  owner: migration_test
  created_at: "2026-06-10T00:00:00Z"

