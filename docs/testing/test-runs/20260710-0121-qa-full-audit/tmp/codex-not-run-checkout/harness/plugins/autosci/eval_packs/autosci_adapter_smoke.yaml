id: autosci_adapter_smoke
name: AutoSci adapter smoke
version: 0.1.0
description: Fixture-mode checks for the AutoSci backend adapter package.
commands:
  - env HARNESS_DIR="$PWD" python3 lib/plugin_loader.py validate --id autosci
  - env HARNESS_DIR="$PWD" python3 lib/plugin_loader.py check-scope --plugin autosci --path artifacts/autosci/demo/result.json
  - python3 plugins/autosci/bin/autosci_bridge.py --help
  - python3 plugins/autosci/bin/autosci_bridge.py smoke
expected_artifacts:
  - artifacts/autosci/smoke/result.json
  - artifacts/autosci/smoke/evidence.jsonl
