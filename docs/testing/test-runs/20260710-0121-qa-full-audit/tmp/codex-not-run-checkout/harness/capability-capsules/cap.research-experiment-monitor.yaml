capability_capsule_id: cap.research-experiment-monitor
capsule_kind: capability
metadata:
  name: Scientific Experiment Monitor
  description: Inspect running or completed scientific experiments and emit bounded status evidence.
applicability:
  task_types:
    - scientific-research
    - experiment-monitor
  positive_signals:
    - experiment status
    - monitor run
    - resume experiment
  negative_signals:
    - design experiment
    - verify claim
contract:
  inputs:
    required:
      - name: experiment_id
        description: Experiment identifier or run artifact reference.
    optional:
      - name: status_scope
        description: Monitor, collect, resume, or diagnose.
  outputs:
    required:
      - name: experiment_status
        schema_ref: schemas/evidence/experiment_status.v1.schema.json
    optional:
      - name: collected_result
        schema_ref: schemas/evidence/experiment_result.v1.schema.json
  preconditions:
    - check: experiment_ref_present
      description: Experiment identifier or run artifacts are available.
  postconditions:
    - check: status_reported
      description: Status report includes state, observations, next actions, and evidence ids.
  invariants:
    - Does not claim successful completion without result evidence.
composition:
  consumes:
    - schema_ref: schemas/evidence/experiment_plan.v1.schema.json
      purpose: Plan being monitored.
    - schema_ref: schemas/evidence/experiment_result.v1.schema.json
      purpose: Optional collected result evidence.
  produces:
    - schema_ref: schemas/evidence/experiment_status.v1.schema.json
      purpose: Experiment status evidence.
  compatible_with:
    - cap.research-experiment-run
    - cap.research-claim-verify
  incompatible_with: []
  requires_after: []
effects:
  read:
    - experiment run artifacts and logs
    - schemas/evidence/experiment_status.v1.schema.json
  write:
    - artifacts/scientific/experiment_status/
  execute:
    - plugins/autosci/bin/autosci_bridge.py
  network:
    - optional status API only when physical operator permits
  cost:
    - bounded monitoring cost
  risk:
    - stale or partial status can mislead downstream verdicts
bindings:
  skills:
    required: []
    optional:
      - autosci.experiment_monitor
      - autosci.experiment_status
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/experiment_status.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against experiment_status.v1.schema.json.
    - Confirm completed state is backed by evidence ids or next action to collect result.
  external_verifier:
    required: false
  pass_conditions:
    - Fixture monitor emits valid experiment_status.v1 evidence.
    - Unknown or stale state is marked blocked or unknown, not completed.
operator_compatibility:
  preferred:
    - ScientificExperimentMonitor
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: phase2_autosci_solar_native_capsules
