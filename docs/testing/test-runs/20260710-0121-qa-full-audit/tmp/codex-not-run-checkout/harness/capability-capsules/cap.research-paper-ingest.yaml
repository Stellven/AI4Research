capability_capsule_id: cap.research-paper-ingest
capsule_kind: capability
metadata:
  name: Scientific Paper Ingest
  description: Normalize a scientific source paper into Solar research paper evidence without mutating research memory.
applicability:
  task_types:
    - scientific-research
    - paper-ingestion
  positive_signals:
    - ingest paper
    - normalize source paper
    - prepare paper evidence
  negative_signals:
    - write final report
    - run experiment
contract:
  inputs:
    required:
      - name: source_ref
        description: Local path, URL, arXiv id, DOI, or prepared source reference.
    optional:
      - name: ingest_hints
        description: Optional title, identifiers, or parsing hints.
  outputs:
    required:
      - name: research_paper
        schema_ref: schemas/evidence/research_paper.v1.schema.json
    optional:
      - name: parse_warnings
        description: Non-fatal parsing warnings and degraded extraction notes.
  preconditions:
    - check: source_ref_present
      description: A source reference is available and attributable.
  postconditions:
    - check: evidence_emitted
      description: Emits research_paper.v1 evidence with provenance and limitations.
  invariants:
    - Does not update durable research memory directly.
    - Preserves original source reference and parser status.
composition:
  consumes:
    - schema_ref: request-envelope.schema.json
      purpose: Source ingestion request.
  produces:
    - schema_ref: schemas/evidence/research_paper.v1.schema.json
      purpose: Normalized paper evidence.
  compatible_with:
    - cap.research-paper-analyze
    - cap.research-method-extract
    - cap.research-claim-extract
  incompatible_with:
    - cap.research-publication-produce
  requires_after: []
effects:
  read:
    - raw scientific source files or URLs
    - schemas/evidence/research_paper.v1.schema.json
  write:
    - artifacts/scientific/research_paper/
  execute:
    - plugins/autosci/bin/autosci_bridge.py
  network:
    - optional metadata lookup only when physical operator is configured for network access
  cost:
    - bounded parser and metadata lookup cost
  risk:
    - source parsing may be partial or lossy
bindings:
  skills:
    required: []
    optional:
      - autosci.paper_ingest
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/research_paper.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against research_paper.v1.schema.json.
    - Confirm source_ref, parse_status, provenance, artifacts, and limitations are present.
  external_verifier:
    required: false
  pass_conditions:
    - Fixture source produces valid research_paper.v1 evidence.
    - Failed or partial parsing is represented with failed or inconclusive status, not hidden success.
operator_compatibility:
  preferred:
    - ScientificPaperIngestor
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: phase2_autosci_solar_native_capsules
