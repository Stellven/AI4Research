version: 1
status: phase0_inventory
principles:
  - Solar Evidence ABI artifacts are the reviewable boundary between workflow nodes.
  - AutoSci raw files and wiki pages are backend-specific source artifacts, not Solar completion evidence by themselves.
  - Every later schema must support completed, failed, and inconclusive status.
  - Every artifact that claims analysis must cite source anchors, model outputs, command logs, or verified runtime state.

artifact_families:
  - autosci_artifact: raw/papers/
    autosci_owner: user
    purpose: User-provided source papers.
    solar_evidence_abi: research_paper.v1
    solar_owner: ScientificPaperIngestor
    adapter_needed: autosci_source_to_research_paper
    inspectable_fields:
      - source_path
      - source_type
      - original_filename
      - checksum
      - parse_status
      - limitations
    human_test: Source paper path is preserved and user-owned raw files are not overwritten.

  - autosci_artifact: raw/notes/
    autosci_owner: user
    purpose: User notes that guide wiki bootstrap and provisional pages.
    solar_evidence_abi: research_memory_update.v1
    solar_owner: ScientificMemoryUpdater
    adapter_needed: autosci_notes_to_memory_update
    inspectable_fields:
      - source_path
      - provisional_entities
      - confidence
      - validation_needed
    human_test: Notes-derived pages are marked provisional and not treated as paper evidence.

  - autosci_artifact: raw/web/
    autosci_owner: user
    purpose: Saved web pages that guide wiki bootstrap and provisional pages.
    solar_evidence_abi: research_memory_update.v1
    solar_owner: ScientificMemoryUpdater
    adapter_needed: autosci_web_to_memory_update
    inspectable_fields:
      - source_path
      - extracted_topic
      - provisional_entities
      - validation_needed
    human_test: Web-derived claims remain provisional until linked to paper or experiment evidence.

  - autosci_artifact: raw/tmp/
    autosci_owner: AutoSci generated handoff
    purpose: Prepared local source sidecars for ingestion.
    solar_evidence_abi: research_paper.v1
    solar_owner: ScientificPaperIngestor
    adapter_needed: autosci_prepared_source_to_research_paper
    inspectable_fields:
      - canonical_ingest_path
      - original_source_path
      - prepared_format
      - warnings
    human_test: Prepared sources retain provenance back to the original raw input.

  - autosci_artifact: raw/discovered/
    autosci_owner: AutoSci discovery/fetch
    purpose: Fetched external papers selected by discovery or bootstrap.
    solar_evidence_abi: literature_discovery.v1
    solar_owner: ScientificLiteratureDiscoverer
    adapter_needed: autosci_discovered_source_to_literature_discovery
    inspectable_fields:
      - candidate_id
      - arxiv_id
      - title
      - fetch_path
      - fetch_status
      - ranking_rationale
    human_test: Discovery artifact explains why a paper was fetched before ingestion occurs.

  - autosci_artifact: .checkpoints/init-prepare.json
    autosci_owner: AutoSci init
    purpose: Prepared local source manifest and warnings.
    solar_evidence_abi: research_memory_update.v1
    solar_owner: ScientificMemoryUpdater
    adapter_needed: autosci_init_prepare_to_memory_update
    inspectable_fields:
      - local_sources
      - canonical_ingest_paths
      - parse_warnings
      - pdf_title_recovery
    human_test: Reviewer can see which local files were considered and which warnings degraded confidence.

  - autosci_artifact: .checkpoints/init-plan.json
    autosci_owner: AutoSci init
    purpose: Discovery plan and shortlist during bootstrap.
    solar_evidence_abi: literature_discovery.v1
    solar_owner: ScientificLiteratureDiscoverer
    adapter_needed: autosci_init_plan_to_literature_discovery
    inspectable_fields:
      - mode
      - topic
      - shortlist
      - ranking_signals
      - source_warnings
    human_test: Final source selection is traceable to shortlist order and explicit selection criteria.

  - autosci_artifact: .checkpoints/init-sources.json
    autosci_owner: AutoSci init
    purpose: Final ingestion source manifest.
    solar_evidence_abi: research_paper.v1
    solar_owner: ScientificPaperIngestor
    adapter_needed: autosci_init_sources_to_research_paper_batch
    inspectable_fields:
      - final_sources
      - origin
      - canonical_ingest_path
      - ingest_order
    human_test: Parallel ingestion reads this manifest rather than rescanning raw directories.

  - autosci_artifact: .checkpoints/discover-*.json
    autosci_owner: AutoSci discover
    purpose: Machine-readable ranked discovery shortlist.
    solar_evidence_abi: literature_discovery.v1
    solar_owner: ScientificLiteratureDiscoverer
    adapter_needed: autosci_discover_to_literature_discovery
    inspectable_fields:
      - seed_mode
      - candidates
      - scores
      - source_channels
      - wiki_dedup_count
      - degraded_sources
    human_test: Shortlist is proposal-only and contains no hidden memory mutation.

  - autosci_artifact: .daily-arxiv/run/recommendation-context.json
    autosci_owner: AutoSci daily-arxiv
    purpose: Fresh-paper recommendation context.
    solar_evidence_abi: literature_discovery.v1
    solar_owner: ScientificLiteratureDiscoverer
    adapter_needed: autosci_daily_context_to_literature_discovery
    inspectable_fields:
      - feed_window
      - wiki_interest_profile
      - candidates
      - source_signals
    human_test: Context is enough for a reviewer to reproduce candidate ranking inputs.

  - autosci_artifact: .daily-arxiv/run/llm-decisions.json
    autosci_owner: AutoSci daily-arxiv
    purpose: LLM recommendation decisions.
    solar_evidence_abi: literature_discovery.v1
    solar_owner: ScientificLiteratureDiscoverer
    adapter_needed: autosci_daily_decisions_to_literature_discovery
    inspectable_fields:
      - decision
      - confidence
      - score
      - rationale
      - signals_used
    human_test: Auto-ingest is allowed only when explicit mode, high confidence, and cap constraints are recorded.

  - autosci_artifact: wiki/papers/{slug}.md
    autosci_owner: AutoSci wiki
    purpose: Paper entity page with metadata, sections, and related links.
    solar_evidence_abi: research_paper.v1
    solar_owner: ScientificPaperAnalyzer
    adapter_needed: autosci_wiki_paper_to_research_paper
    inspectable_fields:
      - title
      - identifiers
      - tldr
      - contribution_type
      - datasets
      - sections
      - limitations
      - source_artifacts
    human_test: Paper evidence can be inspected without reading AutoSci markdown conventions.

  - autosci_artifact: wiki/concepts/{slug}.md
    autosci_owner: AutoSci wiki
    purpose: Concept memory entity.
    solar_evidence_abi: research_memory_update.v1
    solar_owner: ScientificMemoryUpdater
    adapter_needed: autosci_concept_to_memory_update
    inspectable_fields:
      - title
      - aliases
      - maturity
      - key_papers
      - linked_ideas
      - parent_topic
    human_test: Concept update cites source papers or is explicitly provisional.

  - autosci_artifact: wiki/methods/{slug}.md
    autosci_owner: AutoSci wiki
    purpose: Reusable method entity.
    solar_evidence_abi: research_method.v1
    solar_owner: ScientificMethodExtractor
    adapter_needed: autosci_method_to_research_method
    inspectable_fields:
      - name
      - type
      - mechanism
      - procedure
      - source_papers
      - code_repo
      - realizes_concepts
    human_test: Method is named, reusable, citable, and grounded in paper evidence.

  - autosci_artifact: wiki/ideas/{slug}.md
    autosci_owner: AutoSci wiki
    purpose: Idea or hypothesis entity and lifecycle state.
    solar_evidence_abi: idea_candidate.v1
    solar_owner: ScientificIdeaGenerator
    adapter_needed: autosci_idea_to_idea_candidate
    inspectable_fields:
      - title
      - hypothesis
      - approach_sketch
      - origin_gaps
      - novelty_score
      - priority
      - pilot_result
      - failure_reason
      - linked_experiments
    human_test: Proposed and failed ideas both preserve rationale; failed ideas have concrete failure reasons.

  - autosci_artifact: novelty report
    autosci_owner: AutoSci /novelty
    purpose: Novelty assessment of an idea or method.
    solar_evidence_abi: idea_evaluation.v1
    solar_owner: ScientificIdeaEvaluator
    adapter_needed: autosci_novelty_to_idea_evaluation
    inspectable_fields:
      - target
      - novelty_score
      - closest_prior_work
      - differentiation
      - review_llm_assessment
      - recommendation
    human_test: Prior work entries are source-backed and score is conservative.

  - autosci_artifact: review report
    autosci_owner: AutoSci /review
    purpose: Cross-model review of an artifact.
    solar_evidence_abi: idea_evaluation.v1
    solar_owner: ScientificIdeaEvaluator
    adapter_needed: autosci_review_to_idea_evaluation
    inspectable_fields:
      - artifact
      - artifact_type
      - score
      - verdict
      - weaknesses
      - actionable_items
      - entity_mapping
    human_test: Review is read-only and maps findings to entities without silently mutating state.

  - autosci_artifact: /ask answer report
    autosci_owner: AutoSci /ask
    purpose: Wiki-grounded answer synthesized from retrieved pages.
    solar_evidence_abi: scientific_report.v1
    solar_owner: ScientificKnowledgeQuerier
    adapter_needed: autosci_ask_answer_to_scientific_report
    inspectable_fields:
      - question
      - retrieved_pages
      - answer
      - citations
      - knowledge_gaps
      - crystallize_recommendation
    human_test: Answer is read-only unless crystallize is explicit, and every citation points to an existing wiki page.

  - autosci_artifact: wiki/outputs/{query-slug}.md
    autosci_owner: AutoSci /ask crystallize
    purpose: Crystallized answer written back to wiki outputs.
    solar_evidence_abi: research_memory_update.v1
    solar_owner: ScientificMemoryUpdater
    adapter_needed: autosci_ask_crystallize_to_memory_update
    inspectable_fields:
      - original_question
      - source_pages
      - target_path
      - derived_edges
      - created_or_updated_pages
      - context_rebuild_status
    human_test: Crystallized synthesis is traceable to retrieved pages and does not add unsupported claims.

  - autosci_artifact: experiments/pilot/{slug}.yaml
    autosci_owner: AutoSci ideate
    purpose: Pilot experiment contract.
    solar_evidence_abi: experiment_plan.v1
    solar_owner: ScientificExperimentDesigner
    adapter_needed: autosci_pilot_spec_to_experiment_plan
    inspectable_fields:
      - hypothesis
      - implementation
      - setup
      - metrics
      - baseline
      - success_criterion
    human_test: Pilot spec has quantitative pass/fail/inconclusive criteria.

  - autosci_artifact: experiments/pilot/code/{slug}/
    autosci_owner: AutoSci exp-pilot-run
    purpose: Generated pilot code and results.
    solar_evidence_abi: experiment_result.v1
    solar_owner: ScientificExperimentRunner
    adapter_needed: autosci_pilot_code_to_experiment_result
    inspectable_fields:
      - command
      - generated_files
      - approval_record
      - logs
      - result_files
      - metrics
    human_test: Runner evidence includes logs and result JSON, not just prose.

  - autosci_artifact: experiments/pilot/{slug}/report.md
    autosci_owner: AutoSci exp-pilot-eval
    purpose: Pilot verdict report.
    solar_evidence_abi: claim_verdict.v1
    solar_owner: ScientificClaimVerifier
    adapter_needed: autosci_pilot_report_to_claim_verdict
    inspectable_fields:
      - verdict
      - metrics
      - baseline_delta
      - log_signals
      - wiki_changes
      - limitations
    human_test: Pilot pass does not imply final support; limitations remain explicit.

  - autosci_artifact: wiki/experiments/{slug}.md
    autosci_owner: AutoSci wiki
    purpose: Planned/running/completed experiment entity.
    solar_evidence_abi: experiment_plan.v1
    solar_owner: ScientificExperimentDesigner
    adapter_needed: autosci_experiment_page_to_experiment_plan
    inspectable_fields:
      - linked_idea
      - hypothesis
      - setup
      - metrics
      - baseline
      - status
      - outcome
      - key_result
      - run_log
    human_test: Planned experiments have linked idea, metrics, baseline, and quantified success criteria.

  - autosci_artifact: experiments/designs/{slug}-master.md
    autosci_owner: AutoSci exp-design
    purpose: Master design document for experiment suite.
    solar_evidence_abi: experiment_plan.v1
    solar_owner: ScientificExperimentDesigner
    adapter_needed: autosci_master_design_to_experiment_plan
    inspectable_fields:
      - method_candidates
      - benchmarks
      - experiment_blocks
      - ablation_iteration_plan
      - run_order
      - budget
    human_test: Design document exposes dependency order and budget before execution.

  - autosci_artifact: experiments/code/{slug}/
    autosci_owner: AutoSci exp-run
    purpose: Generated experiment code.
    solar_evidence_abi: code_evidence_map.v1
    solar_owner: ScientificCodeEvidenceMapper
    adapter_needed: autosci_experiment_code_to_code_evidence_map
    inspectable_fields:
      - code_files
      - config
      - run_script
      - dependencies
      - linked_experiment
      - linked_idea
    human_test: Code map links files and symbols to experiment plan requirements.

  - autosci_artifact: logs/exp-{slug}.log
    autosci_owner: AutoSci exp-run
    purpose: Experiment execution log.
    solar_evidence_abi: experiment_status.v1
    solar_owner: ScientificExperimentMonitor
    adapter_needed: autosci_log_to_experiment_status
    inspectable_fields:
      - command
      - environment
      - latest_step
      - latest_metric
      - anomalies
      - timestamps
    human_test: Monitor can classify running/anomaly/completed without reading the experiment page.

  - autosci_artifact: results/{slug}/seed_*.json
    autosci_owner: AutoSci exp-run
    purpose: Experiment metric results.
    solar_evidence_abi: experiment_result.v1
    solar_owner: ScientificExperimentRunner
    adapter_needed: autosci_seed_results_to_experiment_result
    inspectable_fields:
      - seed
      - metrics
      - baseline
      - delta
      - runtime
      - warnings
    human_test: Result evidence supports mean/std computation and missing seed detection.

  - autosci_artifact: VERDICT_REPORT
    autosci_owner: AutoSci exp-eval
    purpose: Final experiment-to-idea verdict report.
    solar_evidence_abi: claim_verdict.v1
    solar_owner: ScientificClaimVerifier
    adapter_needed: autosci_verdict_to_claim_verdict
    inspectable_fields:
      - verdict
      - evidence_strength
      - linked_claim_or_idea
      - experiment_refs
      - limitations
      - judge_agreement
      - status_change
    human_test: Supported, partially_supported, not_supported, and inconclusive are distinguishable and evidence-linked.

  - autosci_artifact: wiki/graph/edges.jsonl
    autosci_owner: AutoSci wiki engine
    purpose: Semantic graph edges.
    solar_evidence_abi: research_graph_update.v1
    solar_owner: ScientificGraphUpdater
    adapter_needed: autosci_edges_to_research_graph_update
    inspectable_fields:
      - from
      - to
      - type
      - evidence
      - confidence
      - workflow
    human_test: Each edge type is valid for endpoints and required evidence/confidence exists.

  - autosci_artifact: wiki/graph/citations.jsonl
    autosci_owner: AutoSci wiki engine
    purpose: Bibliographic citation graph.
    solar_evidence_abi: research_graph_update.v1
    solar_owner: ScientificGraphUpdater
    adapter_needed: autosci_citations_to_research_graph_update
    inspectable_fields:
      - from
      - to
      - source
      - date
    human_test: Citation edges are separate from semantic support claims.

  - autosci_artifact: wiki/graph/context_brief.md
    autosci_owner: AutoSci derived graph
    purpose: Compressed research context.
    solar_evidence_abi: research_memory_update.v1
    solar_owner: ScientificMemoryUpdater
    adapter_needed: autosci_context_brief_to_memory_update
    inspectable_fields:
      - generated_at
      - source_entities
      - scope
      - limitations
    human_test: Derived context is not accepted as primary evidence for claims.

  - autosci_artifact: wiki/graph/open_questions.md
    autosci_owner: AutoSci derived graph
    purpose: Gap map and open questions.
    solar_evidence_abi: research_memory_update.v1
    solar_owner: ScientificMemoryUpdater
    adapter_needed: autosci_open_questions_to_memory_update
    inspectable_fields:
      - gap
      - source_entities
      - linked_ideas
      - status
    human_test: Open questions can seed ideas but cannot prove them.

  - autosci_artifact: wiki/outputs/paper-plan-*.md
    autosci_owner: AutoSci paper-plan
    purpose: Paper plan with evidence, sections, figures, and citations.
    solar_evidence_abi: scientific_report.v1
    solar_owner: ScientificReportPlanner
    adapter_needed: autosci_paper_plan_to_scientific_report
    inspectable_fields:
      - target_ideas
      - evidence_map
      - section_outline
      - figure_plan
      - citation_plan
      - review_summary
    human_test: Every section maps to idea/evidence; unconfirmed citations are visible.

  - autosci_artifact: wiki/outputs/related-work-*.md
    autosci_owner: AutoSci survey
    purpose: Related work section output.
    solar_evidence_abi: scientific_report.v1
    solar_owner: ScientificReportPlanner
    adapter_needed: autosci_related_work_to_scientific_report
    inspectable_fields:
      - source_papers
      - thematic_groups
      - positioning_statements
      - citation_coverage
    human_test: Every cited paper exists in wiki or is marked unconfirmed.

  - autosci_artifact: paper/
    autosci_owner: AutoSci paper-draft and paper-compile
    purpose: Drafted and compiled paper.
    solar_evidence_abi: scientific_report.v1
    solar_owner: ScientificReportDrafter
    adapter_needed: autosci_paper_dir_to_scientific_report
    inspectable_fields:
      - main_tex
      - section_files
      - figures
      - references
      - compile_status
      - checks
      - blockers
    human_test: Report gate can reject TODOs, unconfirmed citations, missing figures, or failed compile.

  - autosci_artifact: poster/
    autosci_owner: AutoSci poster
    purpose: Poster publication artifact bundle.
    solar_evidence_abi: publication_bundle.v1
    solar_owner: ScientificPublicationProducer
    adapter_needed: autosci_poster_to_publication_bundle
    inspectable_fields:
      - dag
      - outline_html
      - poster_html
      - poster_png
      - image_assets
      - validation_status
      - overflow_status
    human_test: Poster validates and renders, or missing browser/overflow issues are explicit blockers.

  - autosci_artifact: wiki/outputs/rebuttal-*.md
    autosci_owner: AutoSci rebuttal
    purpose: Rich rebuttal analysis.
    solar_evidence_abi: publication_bundle.v1
    solar_owner: ScientificPublicationProducer
    adapter_needed: autosci_rebuttal_to_publication_bundle
    inspectable_fields:
      - concern_ids
      - concern_mapping
      - evidence_status
      - responses
      - stress_test_scores
      - safety_checklist
    human_test: All reviewer concerns are covered and evidence gaps are not disguised.

  - autosci_artifact: wiki/outputs/rebuttal-*.txt
    autosci_owner: AutoSci rebuttal
    purpose: Plain-text rebuttal for submission systems.
    solar_evidence_abi: publication_bundle.v1
    solar_owner: ScientificPublicationProducer
    adapter_needed: autosci_rebuttal_text_to_publication_bundle
    inspectable_fields:
      - responses
      - revisions
      - commitments
      - evidence_refs
    human_test: No response fabricates data or commits to vague, unbounded experiments.

  - autosci_artifact: wiki/outputs/pipeline-progress.md
    autosci_owner: AutoSci research
    purpose: Full lifecycle progress and resume state.
    solar_evidence_abi: workflow_evolution.v1
    solar_owner: ScientificWorkflowEvolver
    adapter_needed: autosci_pipeline_progress_to_workflow_evolution
    inspectable_fields:
      - slug
      - current_stage
      - mode
      - idea_slug
      - experiment_slugs
      - stage3a_deployed
      - iteration_count
    human_test: Resume can identify completed stages without rerunning completed nodes.

  - autosci_artifact: wiki/outputs/PIPELINE_REPORT.md
    autosci_owner: AutoSci research
    purpose: Full lifecycle completion report.
    solar_evidence_abi: workflow_evolution.v1
    solar_owner: ScientificWorkflowEvolver
    adapter_needed: autosci_pipeline_report_to_workflow_evolution
    inspectable_fields:
      - stage_summary
      - selected_idea
      - experiment_results
      - iteration_history
      - deliverables
      - wiki_growth
      - next_steps
    human_test: Report links each stage to typed node evidence rather than claiming success from orchestration alone.

  - autosci_artifact: lint report from /check
    autosci_owner: AutoSci check
    purpose: Wiki and graph health audit.
    solar_evidence_abi: workflow_evolution.v1
    solar_owner: ScientificWorkflowEvolver
    adapter_needed: autosci_lint_to_workflow_evolution
    inspectable_fields:
      - severity_counts
      - deterministic_errors
      - fixable_items
      - suggested_items
      - residual_risks
    human_test: Deterministic failures block acceptance; optional improvements are not mislabeled as blockers.

  - autosci_artifact: reset_wiki.py dry-run plan
    autosci_owner: AutoSci /reset
    purpose: Destructive maintenance plan listing files that would be deleted or reset.
    solar_evidence_abi: maintenance_reset_plan.v1
    solar_owner: MaintenanceResetOperator
    adapter_needed: autosci_reset_plan_to_maintenance_reset_plan
    inspectable_fields:
      - requested_scope
      - planned_deletes
      - planned_resets
      - raw_delete_warning
      - confirmation_required
      - execution_status
    human_test: The dry-run plan is visible and approved by a human before any destructive reset command runs.

  - autosci_artifact: wiki/outputs/evolution/signals.jsonl
    autosci_owner: AutoSci SciEvolve
    purpose: Append-only memory, workflow, and orchestration feedback signals.
    solar_evidence_abi: workflow_evolution.v1
    solar_owner: ScientificWorkflowEvolver
    adapter_needed: autosci_scievolve_signals_to_workflow_evolution
    inspectable_fields:
      - id
      - source
      - dimension
      - target
      - kind
      - severity
      - confidence
      - evidence_path
    human_test: Signals are evidence inputs, not accepted mutations.

  - autosci_artifact: wiki/outputs/evolution/proposals.jsonl
    autosci_owner: AutoSci SciEvolve
    purpose: Index of proposal-first evolution artifacts.
    solar_evidence_abi: workflow_evolution.v1
    solar_owner: ScientificWorkflowEvolver
    adapter_needed: autosci_scievolve_proposals_to_workflow_evolution
    inspectable_fields:
      - proposal_id
      - dimension
      - target
      - triggering_signals
      - proposed_action
      - risk
      - status
      - artifact_paths
    human_test: Proposed changes remain distinct from approved or applied changes.

  - autosci_artifact: wiki/outputs/evolution/applications.jsonl
    autosci_owner: AutoSci SciEvolve
    purpose: Ledger of guarded proposal applications.
    solar_evidence_abi: workflow_evolution.v1
    solar_owner: ScientificWorkflowEvolver
    adapter_needed: autosci_scievolve_applications_to_workflow_evolution
    inspectable_fields:
      - proposal_id
      - applied_paths
      - validation_status
      - mutation_surface
      - reversible
      - warnings
    human_test: Every applied mutation cites a validated proposal and lists exact changed paths.

  - autosci_artifact: wiki/outputs/evolution/{dream,forge,morph}/<run>/
    autosci_owner: AutoSci /dream /forge /morph
    purpose: SciEvolve run context, policy-runtime response, report, and optional apply report.
    solar_evidence_abi: workflow_evolution.v1
    solar_owner: ScientificWorkflowEvolver
    adapter_needed: autosci_scievolve_run_to_workflow_evolution
    inspectable_fields:
      - run_id
      - dimension
      - context_json
      - agent_prompt
      - agent_response
      - report
      - apply_report
      - rejected_items
    human_test: A reviewer can audit policy input, response, validation, and apply decision without reading AutoSci internals.

abi_coverage:
  research_paper.v1:
    autosci_artifacts:
      - raw/papers/
      - raw/tmp/
      - raw/discovered/
      - wiki/papers/{slug}.md
      - .checkpoints/init-sources.json
  literature_discovery.v1:
    autosci_artifacts:
      - .checkpoints/discover-*.json
      - .checkpoints/init-plan.json
      - .daily-arxiv/run/recommendation-context.json
      - .daily-arxiv/run/llm-decisions.json
  research_memory_update.v1:
    autosci_artifacts:
      - wiki/concepts/{slug}.md
      - wiki/topics/{slug}.md
      - wiki/foundations/{slug}.md
      - wiki/outputs/{query-slug}.md
      - wiki/graph/context_brief.md
      - wiki/graph/open_questions.md
  research_graph_update.v1:
    autosci_artifacts:
      - wiki/graph/edges.jsonl
      - wiki/graph/citations.jsonl
      - wiki/.obsidian/graph.json
      - wiki/canvases/*.canvas
  research_claims.v1:
    autosci_artifacts:
      - implicit paper claims
      - implicit idea hypotheses
      - implicit experiment hypotheses
  research_method.v1:
    autosci_artifacts:
      - wiki/methods/{slug}.md
  code_evidence_map.v1:
    autosci_artifacts:
      - experiments/code/{slug}/
      - experiments/pilot/code/{slug}/
      - methods.code_repo
      - papers.code_url
  idea_candidate.v1:
    autosci_artifacts:
      - wiki/ideas/{slug}.md
      - IDEA_REPORT
  idea_evaluation.v1:
