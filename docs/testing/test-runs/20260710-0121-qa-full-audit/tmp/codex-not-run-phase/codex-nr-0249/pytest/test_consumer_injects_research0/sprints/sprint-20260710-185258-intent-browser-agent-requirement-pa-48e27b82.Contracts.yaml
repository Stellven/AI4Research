schema_version: solar.contract_bundle.v1
request_type: full_prd
source_of_truth: requirement_ir.json
contracts:
  product:
    enabled: true
    goal: 通过 Browser Agent 前门研究后再编译 requirement package。
    success_metrics: &id001
    - PRD、contract、TaskDAG 互相对齐。
    - 实施、验证、兼容/发布路径均已显式表达。
    - 每条验收标准都能追溯到验证或 gate。
    non_goals:
    - 不在首批交付中做完整四区 PM pane 重构。
    - 不绕过 planner 直接进入 builder。
    acceptance: *id001
    stop_rules: &id002
    - 缺少可验证 acceptance 不得标记为完成。
    - 缺少 verifier 决策不得进入 DONE。
  interface:
    enabled: true
    name: RequirementCompilerAdapters
    version: '1.0'
    inputs:
    - RequirementIR
    outputs:
    - ProductBrief
    - ContractsBundle
    - TaskDAG
    - HandoffPackage
    invariants:
    - Requirement IR is the only source of truth.
    - DAG nodes[*].id must be unique.
    - Every acceptance criterion maps to at least one validation step.
    errors:
    - code: CYCLE_DETECTED
      action: split dependencies or ask for clarification
    - code: ACCEPTANCE_COVERAGE_MISSING
      action: add validation before dispatch
  agent_execution:
    enabled: true
    task_scope: full_prd
    allowed_paths:
    - apps/pm-pane/**
    - packages/requirement-ir/**
    - harness/**
    forbidden_paths:
    - infra/prod/**
    - .env*
    - secrets/**
    commands:
      test:
      - pnpm test
      - pnpm lint
      inspect:
      - rg
      - python3
      - pytest
    approval_required_when:
    - new production dependency
    - database migration
    - network access
    - touching auth or billing
    stop_conditions: *id002
  research:
    enabled: false
    hypothesis: 通过 Browser Agent 前门研究后再编译 requirement package。
    source_papers: []
    experiments: []
    adoption_threshold: {}
    rejection_criteria: []
request_excerpt: "# RawIntent Consumer Request - 通过 Browser Agent 前门研究后再编译 requirement\
  \ package。\n\n## Source\n\n- intent_id: intent-20260710-185258-48e27b8269\n- channel:\
  \ pm_dispatch\n- actor: user\n- device: \n- thread_ref: \n\n## Rewritten Objective\n\
  \n通过 Browser Agen"
