capability_capsule_id: cap.research-workflow-evolve
capsule_kind: capability
metadata:
  name: Scientific Workflow Evolve
  description: Propose bounded improvements to scientific workflow templates, memory policy, gates, schemas, or adapter behavior.
applicability:
  task_types:
    - scientific-research
    - workflow-evolution
  positive_signals:
    - improve workflow
    - evolve research process
    - propose methodology change
  negative_signals:
    - run experiment
    - verify claim
contract:
  inputs:
    required:
      - name: trigger_evidence
        description: Postmortem, failure, gap, or review evidence motivating the change.
    optional:
      - name: change_scope
        description: Memory policy, workflow template, operator prompt, schema, gate, adapter, or other.
  outputs:
    required:
      - name: workflow_evolution
        schema_ref: schemas/evidence/workflow_evolution.v1.schema.json
    optional:
      - name: recommended_changes
        description: Human-readable Markdown proposal that separates manual, schema/gate, routing, capsule, and workflow-template changes.
      - name: patch_candidates
        description: Optional non-applied candidate patches for human review; never promoted by this capsule.
      - name: rollback_plan
        description: Reversal or non-application plan for proposed changes.
  preconditions:
    - check: trigger_evidence_present
      description: Evolution proposal is grounded in evidence, not silent self-modification.
  postconditions:
    - check: proposal_recorded
      description: Proposal records scope, change type, rationale, expected effect, approval state, and evidence ids.
  invariants:
    - Does not apply workflow changes without explicit approval.
    - Does not rewrite evaluator or memory policy silently.
composition:
  consumes:
    - schema_ref: schemas/evidence/scientific_report.v1.schema.json
      purpose: Review or postmortem evidence.
    - schema_ref: schemas/evidence/claim_verdict.v1.schema.json
      purpose: Verification failure or uncertainty evidence.
  produces:
    - schema_ref: schemas/evidence/workflow_evolution.v1.schema.json
      purpose: Workflow evolution proposal evidence.
  compatible_with:
    - cap.research-memory-update
    - cap.research-report-plan
  incompatible_with: []
  requires_after: []
effects:
  read:
    - workflow artifacts, evidence, and policy files
    - schemas/evidence/workflow_evolution.v1.schema.json
  write:
    - artifacts/scientific/workflow_evolution/
  execute:
    - plugins/autosci/bin/autosci_bridge.py
  network:
    - none by default
  cost:
    - bounded proposal generation cost
  risk:
    - unsafe workflow evolution can alter scientific semantics or gates
bindings:
  skills:
    required: []
    optional:
      - autosci.workflow_evolve
      - autosci.scievolve
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/workflow_evolution.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against workflow_evolution.v1.schema.json.
    - Confirm approval_state is proposed, approved, rejected, applied, or rolled_back.
  external_verifier:
    required: true
  pass_conditions:
    - Fixture evolution emits valid workflow_evolution.v1 evidence.
    - Evolution report cites concrete failed nodes and gate/runtime reasons.
    - Recommended changes are bounded, category-separated, and review_required.
    - Proposed changes are not applied by this capsule without separate approval.
operator_compatibility:
  preferred:
    - ScientificWorkflowEvolver
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: phase2_autosci_solar_native_capsules
