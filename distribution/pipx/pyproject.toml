[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-solar"
version = "1.0.0rc2"
description = "OpenJiuwen Solar installer wrapper for the shell bootstrap and lifecycle command"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Sihao Li" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/suraj-subrahmanyan/OpenSolar"
Source = "https://github.com/suraj-subrahmanyan/OpenSolar"
Issues = "https://github.com/suraj-subrahmanyan/OpenSolar/issues"

[project.scripts]
openjiuwen-solar = "opensolar_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opensolar_cli*"]
