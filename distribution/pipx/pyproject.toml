[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-solar"
version = "1.0.0rc2"
description = "pipx wrapper for the OpenJiuwen Solar shell installer"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "OpenJiuwen Solar contributors" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
openjiuwen-solar = "opensolar_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opensolar_cli*"]
