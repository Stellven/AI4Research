[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openjiuwen-solar"
version = "0.1.0"
description = "pipx wrapper for the OpenJiuwen Solar shell installer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "OpenJiuwen Solar contributors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
opensolar = "opensolar_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opensolar_cli*"]
