manifest_version: '1.0'
purpose: AutoSci migrated-runtime completion and comparability checks
perfect_run:
  idea_final_status: validated
  experiment_status_path:
  - planned
  - running
  - completed
  main_experiment_outcome: succeeded
  pipeline_final_status: completed
  paper_compile_status: SUCCESS
  blocking_issues: 0
stages:
- id: setup
  commands:
  - ./setup.sh --lang en
  - /setup
  required_outputs:
  - .venv/
  - .env
  - .claude/settings.local.json
  - .claude/skills/
  - CLAUDE.md
- id: init
  commands:
  - /init "<topic>" --no-introduction
  required_outputs:
  - .checkpoints/init-prepare.json
  - .checkpoints/init-plan.json
  - .checkpoints/init-sources.json
  - wiki/index.md
  - wiki/log.md
  - wiki/papers/*.md
  - wiki/concepts/*.md
  - wiki/methods/*.md
  - wiki/graph/edges.jsonl
  - wiki/graph/citations.jsonl
  - wiki/graph/context_brief.md
  - wiki/graph/open_questions.md
- id: check
  commands:
  - /check
  required_terminal_fields:
  - red_issue_count
  - yellow_issue_count
  - blue_issue_count
  acceptance:
    red_issue_count: 0
- id: visualize
  commands:
  - /visualize --all
  required_outputs:
  - wiki/.obsidian/graph.json
  - wiki/canvases/knowledge-map.canvas
  - wiki/canvases/idea-evidence.canvas
- id: ideate
  commands:
  - /ideate "<direction>" --max-ideas 3
  required_outputs:
  - wiki/ideas/*.md
  - wiki/graph/edges.jsonl
  - wiki/graph/context_brief.md
  - wiki/graph/open_questions.md
  required_report: IDEA_REPORT
- id: novelty
  commands:
  - /novelty <idea-slug> --write
  required_state:
    idea.novelty_score: integer 1..5
  required_report: Novelty Report
- id: review
  commands:
  - /review <idea-slug> --difficulty hard --focus method
  required_report: Review Report
- id: pilot_spec
  created_by:
  - /ideate
  required_outputs:
  - experiments/pilot/<idea-slug>.yaml
- id: pilot_run
  commands:
  - /exp-pilot-run <idea-slug> --env local
  required_outputs:
  - experiments/pilot/code/<idea-slug>/train.py
  - experiments/pilot/code/<idea-slug>/config.yaml
  - experiments/pilot/code/<idea-slug>/run.sh
  - experiments/pilot/code/<idea-slug>/requirements.txt
  - experiments/pilot/code/<idea-slug>/pilot.log
  - experiments/pilot/code/<idea-slug>/results/seed_*.json
  required_report: PILOT_REPORT
- id: pilot_eval
  commands:
  - /exp-pilot-eval <idea-slug>
  required_outputs:
  - experiments/pilot/<idea-slug>/report.md
  required_state:
    idea.pilot_result: pass — ...
    idea.status: proposed
  required_report: PILOT_VERDICT_REPORT
- id: experiment_design
  commands:
  - /exp-design <idea-slug>
  required_outputs:
  - experiments/designs/<idea-slug>-master.md
  - wiki/experiments/*.md
  required_state:
    experiment.status: planned
  required_graph_edge: idea --tested_by--> experiment
  required_report: DESIGN_REPORT
- id: experiment_deploy
  commands:
  - /exp-run <experiment-slug> --review --env local
  required_outputs:
  - experiments/code/<experiment-slug>/train.py
  - experiments/code/<experiment-slug>/config.yaml
  - experiments/code/<experiment-slug>/run.sh
  - experiments/code/<experiment-slug>/requirements.txt
  - logs/exp-<experiment-slug>.log
  required_state:
    experiment.status: running
  required_report: DEPLOY_REPORT
- id: experiment_status
  commands:
  - /exp-status
  required_report: Experiment Status Report
- id: experiment_collect
  commands:
  - /exp-run <experiment-slug> --collect
  required_outputs:
  - results/<experiment-slug>/seed_*.json
  required_state:
    experiment.status: completed
    experiment.outcome: succeeded
    experiment.key_result: non-empty
  required_report: RUN_REPORT
- id: experiment_eval
  commands:
  - /exp-eval <experiment-slug>
  required_state:
    idea.status: validated
  required_graph_edge: experiment --supports--> idea
  required_report: VERDICT_REPORT
- id: paper_plan
  commands:
  - /paper-plan <validated-idea-slug> --venue ICLR
  required_outputs:
  - wiki/outputs/paper-plan-<slug>-<date>.md
  required_report: PAPER_PLAN_REPORT
- id: survey
  commands:
  - /survey <validated-idea-slug> --format latex
  required_outputs:
  - wiki/outputs/related-work-<slug>-<date>.md
- id: paper_draft
  commands:
  - /paper-draft wiki/outputs/<paper-plan-file>.md --review
  required_outputs:
  - paper/main.tex
  - paper/math_commands.tex
  - paper/references.bib
  - paper/sections/introduction.tex
  - paper/sections/related_work.tex
  - paper/sections/method.tex
  - paper/sections/experiments.tex
  - paper/sections/conclusion.tex
- id: refine
  commands:
  - /refine paper/main.tex --max-rounds 3 --target-score 8 --focus writing
  required_report: REFINE_REPORT
  acceptance:
    final_score: '>= 8 or verdict ready'
- id: paper_compile
  commands:
  - /paper-compile paper/ --fix
  required_outputs:
  - paper/main.pdf
  required_report: COMPILE_REPORT
  acceptance:
    compilation: SUCCESS
    unconfirmed_citations: 0
    blocking_issues: 0
- id: poster
  commands:
  - /poster paper/ --review --anonymous --no-logos
  required_outputs:
  - poster/dag.json
  - poster/outline.html
  - poster/poster.html
  - poster/poster.png
  required_report: POSTER_REPORT
- id: rebuttal
  commands:
  - /rebuttal raw/reviews/test-review.md --paper-slug <paper-slug> --venue ICLR --stress-test
  required_outputs:
  - wiki/outputs/rebuttal-<slug>.md
  - wiki/outputs/rebuttal-<slug>.txt
- id: integrated_pipeline
  commands:
  - /research "<direction>" --venue ICLR
  - /exp-status --pipeline <pipeline-slug>
  - /research --start-from stage3-collect
  required_outputs:
  - wiki/outputs/pipeline-progress.md
  - wiki/outputs/PIPELINE_REPORT.md
  required_state:
    pipeline.status: completed
