capability_capsule_id: cap.research-poc-idea-evaluation
version: 0.1.0
capsule_kind: capability
metadata:
  name: Fixed Research PoC Idea Evaluation
  description: Select a PoC direction bound strictly to accepted Part A evidence.
applicability:
  task_types: [review]
  positive_signals: [idea evaluation, evidence-bound selection, poc scoping]
  negative_signals: [network retrieval, repository patch, unbounded ideation]
contract:
  inputs:
    required:
      - {name: poc_handoff, type: json}
    optional: []
  outputs:
    required:
      - {name: idea_evaluation, type: json}
    optional: []
  preconditions:
    - {check: task_type_in, values: [review]}
  postconditions:
    - {check: output_present, field: idea_evaluation_json}
  invariants:
    - Every considered idea cites accepted evidence from the handoff manifest.
    - Selection is deterministic and records why rejected candidates were rejected.
    - No idea may depend on evidence absent from the accepted handoff.
composition:
  consumes: [{type: artifact.poc_handoff}]
  produces: [{type: artifact.idea_evaluation}]
  compatible_with: [guard.secret-leak-guard]
  incompatible_with: [resource.repo-workspace, resource.github-readonly]
  requires_after: [cap.research-evidence-poc-handoff]
effects:
  read: [artifacts.poc_handoff]
  write: [artifacts.idea_evaluation]
  execute: []
  network: [none]
  cost: [bounded_local_cpu]
  risk: [evidence_free_ideation, selection_drift]
bindings:
  skills: {required: [], optional: []}
  mcp_capabilities: {}
  data_refs: []
  secret_refs: []
  required_guard_capsules: [guard.secret-leak-guard]
  required_resource_capsules: []
verification:
  self_check: []
  external_verifier: {required: false, preferred_capsules: []}
  pass_conditions: []
operator_compatibility:
  preferred: [autosci-research-poc-idea-evaluation-worker]
  forbidden: []
provenance:
  owner: opensolar
  created_at: "2026-08-18T00:00:00Z"
