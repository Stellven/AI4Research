capability_capsule_id: cap.requirement-research-synthesizer
version: 0.3.0
capsule_kind: capability
metadata:
  name: Grounded Research Synthesizer
  description: Compile verified source packs and an evidence-linked synthesis plan into a governed research report bundle.
applicability:
  task_types:
    - research
    - evidence
    - report-writing
  positive_signals:
    - synthesis
    - implication
    - critique
    - evidence
    - research
  negative_signals:
    - simple_patch
contract:
  inputs:
    required:
      - name: research_question
        type: markdown
      - name: source_packs
        type: directory_list
      - name: synthesis_plan
        type: json
    optional:
      - name: contradiction_review
        type: jsonl
      - name: evidence_gaps
        type: markdown
  outputs:
    required:
      - name: sources_jsonl
        type: jsonl
      - name: evidence_jsonl
        type: jsonl
      - name: extracts_dir
        type: directory
      - name: synthesis_plan_json
        type: json
      - name: claims_jsonl
        type: jsonl
      - name: claim_evidence_jsonl
        type: jsonl
      - name: evidence_gaps_json
        type: json
      - name: sections_jsonl
        type: jsonl
      - name: section_checks_jsonl
        type: jsonl
      - name: report_ast_json
        type: json
      - name: final_bibliography_json
        type: json
      - name: final_md
        type: markdown
      - name: research_eval_json
        type: json
    optional: []
  preconditions:
    - check: task_type_in
      values:
        - research
        - evidence
        - report-writing
  postconditions:
    - check: output_present
      field: claims_jsonl
    - check: output_present
      field: report_ast_json
    - check: output_present
      field: final_md
    - check: output_present
      field: research_eval_json
  invariants:
    - Every input source pack passes deterministic retrieval closeout before synthesis.
    - Every supported claim uses v2 evidence links with exact quotes copied from verified evidence rows.
    - Contradicting and qualifying links are preserved; mixed claims are uncertainty-labelled and confidence-capped.
    - The grounded compiler publishes the report bundle atomically only after deterministic preflight.
    - Missing, contradictory, or insufficient evidence is stated as a bounded gap and is never replaced with model-authored source text.
composition:
  consumes:
    - type: artifact.research_question
    - type: artifact.source_pack
    - type: artifact.synthesis_plan
  produces:
    - type: artifact.grounded_research_report
  compatible_with:
    - guard.secret-leak-guard
    - cap.research-retrieval
  incompatible_with: []
  requires_after: []
effects:
  read:
    - research.question
    - artifacts.source_pack
    - artifacts.evidence_review
  write:
    - artifacts.research_report
  execute:
    - research.compile-grounded
  network: []
  cost:
    - premium_model_quota
  risk:
    - unsupported_implication
bindings:
  skills:
    required: []
    optional: []
  mcp_capabilities: {}
  data_refs: []
  secret_refs: []
  required_guard_capsules:
    - guard.secret-leak-guard
  required_resource_capsules: []
verification:
  self_check:
    - check.source_packs_verified
    - check.claim_evidence_resolved
    - check.grounded_report_bundle_written
  external_verifier:
    required: true
    preferred_capsules:
      - cap.requirement-compiler-verification
  pass_conditions:
    - claims.jsonl contains only schema-valid claims with exact quoted evidence links
    - final.md citations resolve to evidence.jsonl
    - report_ast.json, research_eval.json, and the full grounded report bundle pass deterministic final closeout
operator_compatibility:
  preferred:
    - mini-codex-gpt55-medium-builder-1
  forbidden:
    - mini-antigravity-gemini35-flash-high
provenance:
  owner: opensolar
  created_at: "2026-05-24T00:00:00Z"
  updated_at: "2026-07-16T00:00:00Z"
