capability_capsule_id: cap.research-source-validation
version: 0.1.0
capsule_kind: capability
metadata:
  name: Fixed Research Source Validation
  description: Validate source provenance, hashes, readability, deduplication, and deterministic topic relevance before synthesis.
applicability:
  task_types: [research]
  positive_signals: [source validation, topic relevance, provenance verification]
  negative_signals: [network retrieval, model synthesis, repository patch]
contract:
  inputs:
    required:
      - {name: source_discovery, type: json}
    optional: []
  outputs:
    required:
      - {name: source_validation, type: json}
    optional: []
  preconditions:
    - {check: task_type_in, values: [research]}
  postconditions:
    - {check: output_present, field: source_validation_json}
  invariants:
    - Accepted candidates retain source IDs, acquisition channels, provider provenance, content hashes, and deterministic relevance evidence.
    - Validation performs no network or model call and cannot promote an off-topic live candidate solely because it has a substantive title or abstract.
composition:
  consumes: [{type: artifact.source_discovery}]
  produces: [{type: artifact.source_validation}]
  compatible_with: [guard.secret-leak-guard]
  incompatible_with: [resource.repo-workspace, resource.github-readonly]
  requires_after: [cap.research-public-source-discovery]
effects:
  read: [artifacts.source_discovery]
  write: [artifacts.source_validation]
  execute: []
  network: [none]
  cost: [bounded_local_cpu]
  risk: [false_relevance_acceptance, evidence_provenance_mismatch]
bindings:
  skills: {required: [], optional: []}
  mcp_capabilities: {}
  data_refs: []
  secret_refs: []
  required_guard_capsules: [guard.secret-leak-guard]
  required_resource_capsules: []
verification:
  self_check: []
  external_verifier: {required: false, preferred_capsules: []}
  pass_conditions: []
operator_compatibility:
  preferred: [autosci-research-synthesis-source-validation-worker]
  forbidden: []
provenance:
  owner: opensolar
  created_at: "2026-08-18T00:00:00Z"
