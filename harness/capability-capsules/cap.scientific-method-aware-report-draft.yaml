capability_capsule_id: cap.scientific-method-aware-report-draft
capsule_kind: capability
metadata:
  name: Method- and source-assessment-aware Scientific Report Draft
  description: Draft a scientific report from its plan, claim verdicts, structured method evidence, governed source-quality decisions, and the preserved study protocol.
applicability:
  task_types:
    - scientific-research
    - report-drafting
  positive_signals:
    - draft report with methods
    - compare research methods
    - preserve method evidence
  negative_signals:
    - execute experiment
    - report without method evidence
contract:
  inputs:
    required:
      - name: scientific_report_plan
        schema_ref: schemas/evidence/scientific_report_plan.v1.schema.json
      - name: claim_verdict
        schema_ref: schemas/evidence/claim_verdict.v1.schema.json
      - name: research_method
        schema_ref: schemas/evidence/research_method.v1.schema.json
      - name: research_source_assessment
        schema_ref: schemas/evidence/research_source_assessment.v1.schema.json
  outputs:
    required:
      - name: scientific_report
        schema_ref: schemas/evidence/scientific_report.v1.schema.json
  preconditions:
    - check: method_aware_plan_available
      description: The report plan, verdicts, method evidence, and source assessment are available.
  postconditions:
    - check: draft_evidence_linked
      description: Findings and method descriptions cite retained evidence IDs.
    - check: study_protocol_rendered
      description: The final report renders search strategy, source-selection criteria, time range, inclusion/exclusion criteria, and unresolved protocol fields from its plan.
  invariants:
    - Supplied method evidence is rendered and not silently dropped.
    - Unsupported claims remain explicit.
    - Study-protocol limitations from the report plan remain explicit and are not silently resolved.
composition:
  consumes:
    - schema_ref: schemas/evidence/scientific_report_plan.v1.schema.json
      purpose: Planned report evidence, including the preserved study protocol and unresolved protocol fields.
    - schema_ref: schemas/evidence/claim_verdict.v1.schema.json
      purpose: Verdict-backed claims.
    - schema_ref: schemas/evidence/research_method.v1.schema.json
      purpose: Structured method evidence assigned by the report plan.
    - schema_ref: schemas/evidence/research_source_assessment.v1.schema.json
      purpose: Source-quality decisions that constrain which evidence can support report findings.
  produces:
    - schema_ref: schemas/evidence/scientific_report.v1.schema.json
      purpose: Method-aware scientific report.
  compatible_with:
    - cap.research-publication-produce
  incompatible_with: []
  requires_after:
    - cap.research-method-aware-report-plan
effects:
  read:
    - typed scientific evidence and report plans
    - schemas/evidence/research_method.v1.schema.json
    - schemas/evidence/research_source_assessment.v1.schema.json
    - schemas/evidence/scientific_report_plan.v1.schema.json
    - schemas/evidence/scientific_report.v1.schema.json
  write:
    - artifacts/scientific/scientific_report/
  execute:
    - plugins/autosci/operators/scientific_lifecycle/action/delivery.py
  network:
    - none
  cost:
    - bounded drafting cost
  risk:
    - narrative generation can overstate method evidence without review
bindings:
  skills:
    required: []
    optional:
      - autosci.report_draft
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/research_method.v1.schema.json
    - schemas/evidence/research_source_assessment.v1.schema.json
    - schemas/evidence/scientific_report_plan.v1.schema.json
    - schemas/evidence/scientific_report.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against scientific_report.v1.schema.json.
    - Confirm the Methods section retains method evidence IDs and limitations.
    - Confirm the report contains a study-protocol section copied from the report plan.
  external_verifier:
    required: true
  pass_conditions:
    - Supplied method evidence appears in the report without changing its claims.
    - Excluded or unresolved sources are not silently promoted to accepted support.
    - Requirement bindings from the accepted report plan remain visible for independent evaluation.
    - Study-protocol values and unresolved fields remain visible in the final report.
operator_compatibility:
  preferred:
    - autosci-report-worker
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: elastic_planner_method_handoff
