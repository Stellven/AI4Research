capability_capsule_id: cap.research-dataset-prepare
capsule_kind: capability
metadata:
  name: Public Dataset and Experiment Asset Preparation
  description: Acquire a supported real public dataset/model and retain the exact runnable code and hashes needed for a bounded scientific PoC.
applicability:
  task_types: [scientific-research, dataset-preparation, experiment-run]
  positive_signals: [prepare dataset, acquire public dataset, build experiment package, runnable poc]
  negative_signals: [design only, no experiment]
contract:
  inputs:
    required:
      - name: governed_claims
        schema_ref: schemas/evidence/research_claims.v1.schema.json
  outputs:
    required:
      - name: dataset_manifest
        type: collection
        schema_ref: schemas/evidence/dataset_manifest.v1.schema.json
  preconditions:
    - check: supported_experiment_family
      description: A registered real experiment family matches the selected testable claim.
  postconditions:
    - check: package_hash_bound
      description: Dataset, model, runner, inputs, seeds, and result route are retained with content hashes.
  invariants:
    - Public data/model acquisition is attributable and never replaced with a fixture or synthetic result.
    - Preparation does not claim the experiment was executed.
composition:
  consumes:
    - schema_ref: schemas/evidence/research_claims.v1.schema.json
      purpose: Selected governed claim that determines the experiment family.
  produces:
    - schema_ref: schemas/evidence/dataset_manifest.v1.schema.json
      purpose: Directory collection containing the dataset manifest, retained dataset slice, model state, and runnable code.
  compatible_with: [cap.research-executable-experiment-design, cap.research-experiment-run]
  incompatible_with: []
  requires_after: []
effects:
  read: [governed claim evidence]
  write: [retained public dataset, model assets, runnable PoC code, manifest]
  execute: [plugins/autosci/operators/scientific_lifecycle/action/dataset.py]
  network: [required for attributable public dataset and model acquisition]
  cost: [bounded CPU/disk preparation]
  risk: [provider availability, dataset/model licensing, disk use]
bindings:
  skills:
    required: []
    optional: [autosci.dataset_prepare, autosci.experiment_package]
  mcp_capabilities: {}
  data_refs: [schemas/evidence/dataset_manifest.v1.schema.json]
  secret_refs: []
verification:
  self_check:
    - Validate dataset_manifest.v1 and recompute every retained asset hash.
  external_verifier:
    required: true
  pass_conditions:
    - A real public dataset/model and runnable hash-bound package are retained for a registered experiment family.
operator_compatibility:
  preferred: [dataset_prepare_worker]
  forbidden: [BackendFullWorkflowRunner]
implementation:
  trust_class: evidence_transform
  entrypoint: plugins.autosci.operators.scientific_lifecycle.action.dataset:prepare_dataset
  required_services: [experiment_package_builder]
provenance:
  owner: opensolar
  source_phase: elastic_planner_real_poc
