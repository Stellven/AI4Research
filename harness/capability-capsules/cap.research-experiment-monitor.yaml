capability_capsule_id: cap.research-experiment-monitor
capsule_kind: capability
metadata:
  name: Post-run Experiment Result Verification
  description: Verify retained completed experiment results and emit post-run status evidence; this capsule does not observe a live process.
applicability:
  task_types:
    - scientific-research
    - experiment-monitor
  positive_signals:
    - verify completed experiment status
    - collect retained result status
    - post-run result verification
  negative_signals:
    - design experiment
    - verify claim
    - monitor running experiment
    - resume experiment
contract:
  inputs:
    required:
      - name: experiment_plan
        schema_ref: schemas/evidence/experiment_plan.v1.schema.json
      - name: experiment_result
        schema_ref: schemas/evidence/experiment_result.v1.schema.json
    optional:
      - name: status_scope
        description: Monitor, collect, resume, or diagnose.
  outputs:
    required:
      - name: experiment_status
        schema_ref: schemas/evidence/experiment_status.v1.schema.json
    optional:
      - name: collected_result
        schema_ref: schemas/evidence/experiment_result.v1.schema.json
  preconditions:
    - check: completed_result_present
      description: A retained completed experiment result and its plan are available.
  postconditions:
    - check: status_reported
      description: Status report includes state, observations, next actions, and evidence ids.
  invariants:
    - Does not claim successful completion without result evidence.
    - Does not claim to observe, resume, or control a live experiment process.
composition:
  consumes:
    - schema_ref: schemas/evidence/experiment_plan.v1.schema.json
      purpose: Plan being monitored.
    - schema_ref: schemas/evidence/experiment_result.v1.schema.json
      purpose: Retained completed result evidence under post-run verification.
  produces:
    - schema_ref: schemas/evidence/experiment_status.v1.schema.json
      purpose: Experiment status evidence.
  compatible_with:
    - cap.research-experiment-run
    - cap.research-claim-verify
  incompatible_with: []
  requires_after: []
effects:
  read:
    - experiment run artifacts and logs
    - schemas/evidence/experiment_status.v1.schema.json
  write:
    - artifacts/scientific/experiment_status/
  execute:
    - plugins/autosci/operators/scientific_lifecycle/action/experiment.py
  network:
    - forbidden
  cost:
    - bounded post-run verification cost
  risk:
    - stale or incomplete retained results can mislead downstream verdicts
bindings:
  skills:
    required: []
    optional:
      - autosci.experiment_monitor
      - autosci.experiment_status
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/experiment_status.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against experiment_status.v1.schema.json.
    - Confirm completed state is backed by evidence ids or next action to collect result.
    - Confirm the output is described as post-run verification, not live monitoring.
  external_verifier:
    required: false
  pass_conditions:
    - Retained completed local experiment evidence emits valid experiment_status.v1 evidence.
    - Unknown or stale state is marked blocked or unknown, not completed.
operator_compatibility:
  preferred:
    - experiment_monitor_worker
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: phase2_autosci_solar_native_capsules
implementation:
  trust_class: evidence_transform
  entrypoint: plugins.autosci.operators.scientific_lifecycle.action.experiment:monitor_experiment
  required_services: []
