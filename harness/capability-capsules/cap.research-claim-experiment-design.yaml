capability_capsule_id: cap.research-claim-experiment-design
capsule_kind: capability
metadata:
  name: Governed Claim Experiment Design
  description: Design one bounded experiment directly from a governed, testable research claim.
applicability:
  task_types:
    - scientific-research
    - experiment-design
  positive_signals:
    - design experiment from claim
    - test supplied claim
    - create bounded claim experiment
  negative_signals:
    - generate a new research idea
    - execute experiment
contract:
  inputs:
    required:
      - name: research_claims
        schema_ref: schemas/evidence/research_claims.v1.schema.json
  outputs:
    required:
      - name: experiment_plan
        schema_ref: schemas/evidence/experiment_plan.v1.schema.json
  preconditions:
    - check: testable_claim_present
      description: At least one governed claim identifies its testability and source evidence.
  postconditions:
    - check: plan_complete
      description: The plan identifies the source claim, hypothesis, variables, metrics, procedure, limits, and approval boundary.
  invariants:
    - Does not invent a new idea when the user supplied the claim to test.
    - Does not execute the experiment.
    - Preserves the selected claim identifier and origin evidence identifiers.
composition:
  consumes:
    - schema_ref: schemas/evidence/research_claims.v1.schema.json
      purpose: Governed claim set from which one test target is selected.
  produces:
    - schema_ref: schemas/evidence/experiment_plan.v1.schema.json
      purpose: Bounded design tied to the selected claim.
  compatible_with:
    - cap.research-experiment-run
    - cap.research-experiment-monitor
    - cap.research-claim-verify
  incompatible_with: []
  requires_after: []
effects:
  read:
    - governed research claims
    - schemas/evidence/experiment_plan.v1.schema.json
  write:
    - artifacts/scientific/experiment_plan/
  execute:
    - plugins/autosci/operators/scientific_lifecycle/action/experiment.py
  network:
    - none by default
  cost:
    - bounded planning cost
  risk:
    - a vague claim may yield an incomplete or non-executable design
bindings:
  skills:
    required: []
    optional:
      - autosci.experiment_design
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/research_claims.v1.schema.json
    - schemas/evidence/experiment_plan.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against experiment_plan.v1.schema.json.
    - Confirm source_claim_id and origin_evidence_ids refer to the supplied claim.
  external_verifier:
    required: true
  pass_conditions:
    - A testable supplied claim emits valid experiment_plan.v1 evidence.
    - The design remains bounded and does not execute.
operator_compatibility:
  preferred:
    - experiment_design_worker
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: elastic_planner_capsule_completion
implementation:
  trust_class: evidence_transform
  entrypoint: plugins.autosci.operators.scientific_lifecycle.action.experiment:design_experiment
  required_services: []
