capability_capsule_id: cap.research-experiment-run
capsule_kind: capability
metadata:
  name: Scientific Experiment Run
  description: Execute or simulate approved scientific experiment plans and emit result evidence.
applicability:
  task_types:
    - scientific-research
    - experiment-run
  positive_signals:
    - run experiment
    - execute pilot
    - collect experiment result
  negative_signals:
    - design only
    - write report
contract:
  inputs:
    required:
      - name: experiment_plan
        schema_ref: schemas/evidence/experiment_plan.v1.schema.json
      - name: experiment_approval
        schema_ref: schemas/evidence/experiment_approval.v1.schema.json
    optional:
      - name: execution_mode
        description: fixture, dry-run, bounded-local, benchmark, or approved-external.
  outputs:
    required:
      - name: experiment_result
        schema_ref: schemas/evidence/experiment_result.v1.schema.json
    optional:
      - name: experiment_status
        schema_ref: schemas/evidence/experiment_status.v1.schema.json
  preconditions:
    - check: plan_available
      description: Experiment plan evidence is valid and reviewed.
    - check: approval_satisfied
      description: Required approval is present for non-fixture or external modes.
  postconditions:
    - check: result_evidence_emitted
      description: Result evidence records outcome, metrics, artifacts, provenance, and limitations.
  invariants:
    - Does not silently run external experiments without approval.
    - Failed runs emit failed or inconclusive evidence.
composition:
  consumes:
    - schema_ref: schemas/evidence/experiment_plan.v1.schema.json
      purpose: Reviewed experiment plan.
    - schema_ref: schemas/evidence/experiment_approval.v1.schema.json
      purpose: Hash-bound approval for the exact experiment plan.
  produces:
    - schema_ref: schemas/evidence/experiment_result.v1.schema.json
      purpose: Experiment result evidence.
    - schema_ref: schemas/evidence/experiment_status.v1.schema.json
      purpose: Optional run status evidence.
  compatible_with:
    - cap.research-experiment-monitor
    - cap.research-claim-verify
  incompatible_with: []
  requires_after:
    - cap.research-experiment-design
effects:
  read:
    - experiment plans and code artifacts
    - schemas/evidence/experiment_result.v1.schema.json
  write:
    - artifacts/scientific/experiment_result/
    - optional local experiment outputs
  execute:
    - plugins/autosci/bin/autosci_bridge.py
  network:
    - none in fixture and dry-run modes; explicit approval required otherwise
  cost:
    - execution cost depends on execution_mode and must be bounded
  risk:
    - experiments can consume compute, mutate local outputs, or fail nondeterministically
bindings:
  skills:
    required: []
    optional:
      - autosci.experiment_run
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/experiment_result.v1.schema.json
    - schemas/evidence/experiment_status.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted result evidence against experiment_result.v1.schema.json.
    - Confirm execution_mode and approval state are visible in inputs or limitations.
  external_verifier:
    required: true
  pass_conditions:
    - Fixture run emits valid experiment_result.v1 evidence.
    - Failed execution emits failed status with artifacts and limitations.
operator_compatibility:
  preferred:
    - autosci-experiment-run-worker
  forbidden:
    - BackendFullWorkflowRunner
implementation:
  trust_class: fixture_or_adapter_only
provenance:
  owner: opensolar
  source_phase: phase2_autosci_solar_native_capsules
