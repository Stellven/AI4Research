capability_capsule_id: cap.research-experiment-run
capsule_kind: capability
metadata:
  name: Scientific Experiment Run
  description: Execute one approved, hash-bound local experiment and emit measured result evidence.
applicability:
  task_types:
    - scientific-research
    - experiment-run
  positive_signals:
    - run experiment
    - execute pilot
    - collect experiment result
  negative_signals:
    - design only
    - write report
contract:
  inputs:
    required:
      - name: experiment_plan
        schema_ref: schemas/evidence/experiment_plan.v1.schema.json
      - name: experiment_approval
        schema_ref: schemas/evidence/experiment_approval.v1.schema.json
  outputs:
    required:
      - name: experiment_result
        schema_ref: schemas/evidence/experiment_result.v1.schema.json
  preconditions:
    - check: plan_available
      description: Experiment plan evidence is valid and reviewed.
    - check: approval_satisfied
      description: Required approval is present for non-fixture or external modes.
  postconditions:
    - check: result_evidence_emitted
      description: Result evidence records outcome, metrics, artifacts, provenance, and limitations.
  invariants:
    - Runs only an exact Python runner and input files whose hashes are bound into the approved plan.
    - Denies network access and writes only inside the approved experiment scope.
    - Does not claim measured execution when the process or result contract fails.
composition:
  consumes:
    - schema_ref: schemas/evidence/experiment_plan.v1.schema.json
      purpose: Reviewed experiment plan.
    - schema_ref: schemas/evidence/experiment_approval.v1.schema.json
      purpose: Hash-bound approval for the exact experiment plan.
  produces:
    - schema_ref: schemas/evidence/experiment_result.v1.schema.json
      purpose: Measured experiment result with recomputed criteria and runtime evidence.
  compatible_with:
    - cap.research-experiment-monitor
    - cap.research-claim-verify
    - cap.research-native-experiment-approval
  incompatible_with: []
  requires_after:
    - cap.research-experiment-design
effects:
  read:
    - approved experiment plans, hash-bound Python runners, and hash-bound input datasets
    - schemas/evidence/experiment_result.v1.schema.json
  write:
    - artifacts/scientific/experiment_result/
    - approved local experiment outputs
  execute:
    - plugins/autosci/operators/scientific_lifecycle/action/experiment.py
    - plugins/autosci/services/bounded_experiment.py
  network:
    - forbidden
  cost:
    - bounded by the approved timeout and output limits
  risk:
    - experiments can consume compute, mutate local outputs, or fail nondeterministically
bindings:
  skills:
    required: []
    optional:
      - autosci.experiment_run
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/experiment_result.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted result evidence against experiment_result.v1.schema.json.
    - Confirm the exact plan approval and result hash are retained, and that runner/input hashes were enforced before launch.
  external_verifier:
    required: true
  pass_conditions:
    - The approved process exits successfully and emits valid measured experiment_result.v1 evidence.
    - Acceptance criteria are recomputed from measured metrics rather than trusted from the runner.
operator_compatibility:
  preferred:
    - experiment_run_worker
  forbidden:
    - BackendFullWorkflowRunner
implementation:
  trust_class: measured_execution
  entrypoint: plugins.autosci.operators.scientific_lifecycle.action.experiment:run_experiment
  required_services:
    - experiment_executor
provenance:
  owner: opensolar
  source_phase: phase2_autosci_solar_native_capsules
