capability_capsule_id: cap.research-report-plan
capsule_kind: capability
metadata:
  name: Scientific Report Plan
  description: Plan scientific reports or papers from typed evidence, verdicts, and unsupported-claim gaps.
applicability:
  task_types:
    - scientific-research
    - report-planning
  positive_signals:
    - plan report
    - paper outline
    - survey plan
  negative_signals:
    - execute experiment
    - publish bundle
contract:
  inputs:
    required:
      - name: evidence_refs
        description: Paper, claim, verdict, experiment, or idea evidence references.
    optional:
      - name: audience
        description: Report audience or publication venue constraints.
  outputs:
    required:
      - name: scientific_report_plan
        schema_ref: schemas/evidence/scientific_report_plan.v1.schema.json
    optional:
      - name: evidence_gap_list
        description: Unsupported or inconclusive claims to avoid presenting as findings.
  preconditions:
    - check: evidence_refs_present
      description: Report plan has typed evidence inputs.
  postconditions:
    - check: report_plan_evidenced
      description: Sections cite evidence ids and unsupported claims are explicit.
  invariants:
    - Does not draft unsupported claims as findings.
    - Does not compile publication artifacts.
composition:
  consumes:
    - schema_ref: schemas/evidence/claim_verdict.v1.schema.json
      purpose: Verdict-backed findings.
  produces:
    - schema_ref: schemas/evidence/scientific_report_plan.v1.schema.json
      purpose: Planned report evidence.
  compatible_with:
    - cap.scientific-report-draft
    - cap.research-publication-produce
  incompatible_with: []
  requires_after: []
effects:
  read:
    - typed scientific evidence artifacts
    - schemas/evidence/scientific_report_plan.v1.schema.json
  write:
    - artifacts/scientific/scientific_report_plan/
  execute:
    - plugins/autosci/bin/autosci_bridge.py
  network:
    - none by default
  cost:
    - bounded planning cost
  risk:
    - report plans can overstate unsupported evidence if gaps are omitted
bindings:
  skills:
    required: []
    optional:
      - autosci.report_plan
      - autosci.paper_plan
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/scientific_report_plan.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against scientific_report_plan.v1.schema.json.
    - Confirm unsupported_claims is present and section evidence ids are populated.
  external_verifier:
    required: false
  pass_conditions:
    - Fixture report plan emits valid scientific_report_plan.v1 evidence.
    - Evidence gaps remain visible in unsupported_claims or limitations.
operator_compatibility:
  preferred:
    - autosci-report-plan-worker
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: phase2_autosci_solar_native_capsules
