capability_capsule_id: cap.scientific-report-draft
capsule_kind: capability
metadata:
  name: Scientific Report Draft
  description: Draft scientific reports or paper sections from typed evidence while keeping unsupported claims and the report plan's study protocol explicit.
applicability:
  task_types:
    - scientific-research
    - report-drafting
  positive_signals:
    - draft report
    - write paper section
    - compile evidence narrative
  negative_signals:
    - run experiment
    - generate idea
contract:
  inputs:
    required:
      - name: scientific_report_plan
        schema_ref: schemas/evidence/scientific_report_plan.v1.schema.json
      - name: claim_verdict
        schema_ref: schemas/evidence/claim_verdict.v1.schema.json
    optional:
      - name: style_constraints
        description: Audience, venue, or formatting guidance.
  outputs:
    required:
      - name: scientific_report
        schema_ref: schemas/evidence/scientific_report.v1.schema.json
    optional:
      - name: draft_files
        description: Markdown, LaTeX, or section files emitted as artifacts.
  preconditions:
    - check: evidence_available
      description: Drafting has typed evidence or report plan input.
  postconditions:
    - check: draft_evidence_linked
      description: Report sections and findings cite evidence ids.
    - check: study_protocol_rendered
      description: The final report renders search strategy, source-selection criteria, time range, inclusion/exclusion criteria, and unresolved protocol fields from its plan.
  invariants:
    - Unsupported claims remain explicit and are not presented as successful findings.
    - Study-protocol limitations from the report plan remain explicit and are not silently resolved.
composition:
  consumes:
    - schema_ref: schemas/evidence/scientific_report_plan.v1.schema.json
      purpose: Planned report evidence, including the preserved study protocol and unresolved protocol fields.
    - schema_ref: schemas/evidence/claim_verdict.v1.schema.json
      purpose: Verdict-backed claims.
  produces:
    - schema_ref: schemas/evidence/scientific_report.v1.schema.json
      purpose: Draft report evidence.
  compatible_with:
    - cap.research-publication-produce
    - cap.research-memory-update
  incompatible_with: []
  requires_after:
    - cap.research-report-plan
effects:
  read:
    - typed scientific evidence and report plans
    - schemas/evidence/scientific_report_plan.v1.schema.json
    - schemas/evidence/scientific_report.v1.schema.json
  write:
    - artifacts/scientific/scientific_report/
  execute:
    - plugins/autosci/bin/autosci_bridge.py
  network:
    - none by default
  cost:
    - bounded drafting cost
  risk:
    - narrative generation can overstate evidence without verifier checks
bindings:
  skills:
    required: []
    optional:
      - autosci.report_draft
      - autosci.paper_draft
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/scientific_report_plan.v1.schema.json
    - schemas/evidence/scientific_report.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against scientific_report.v1.schema.json.
    - Confirm sections cite evidence ids and unsupported_claims is explicit.
    - Confirm the report contains a study-protocol section copied from the report plan.
  external_verifier:
    required: true
  pass_conditions:
    - Fixture draft emits valid scientific_report.v1 evidence.
    - Claims without evidence appear in unsupported_claims or limitations.
    - Study-protocol values and unresolved fields remain visible in the final report.
operator_compatibility:
  preferred:
    - autosci-report-worker
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: phase2_autosci_solar_native_capsules
