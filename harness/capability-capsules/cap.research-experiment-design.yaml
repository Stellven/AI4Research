capability_capsule_id: cap.research-experiment-design
capsule_kind: capability
metadata:
  name: Scientific Experiment Design
  description: Design bounded scientific experiments with objectives, hypotheses, metrics, procedure, and approval requirements.
applicability:
  task_types:
    - scientific-research
    - experiment-design
  positive_signals:
    - design experiment
    - create experiment plan
    - pilot spec
  negative_signals:
    - run experiment
    - collect results
contract:
  inputs:
    required:
      - name: claim_or_idea_ref
        description: Claim, idea, or hypothesis being tested.
    optional:
      - name: code_evidence_map
        schema_ref: schemas/evidence/code_evidence_map.v1.schema.json
  outputs:
    required:
      - name: experiment_plan
        schema_ref: schemas/evidence/experiment_plan.v1.schema.json
    optional:
      - name: approval_notes
        description: Safety or human-review notes before execution.
  preconditions:
    - check: test_target_present
      description: Claim or idea target is identified and testable.
  postconditions:
    - check: plan_complete
      description: Plan includes hypothesis, variables, metrics, procedure, expected artifacts, and approval flag.
  invariants:
    - Does not execute experiments.
    - Real external execution requires explicit later approval.
composition:
  consumes:
    - schema_ref: schemas/evidence/idea_candidate.v1.schema.json
      purpose: Idea candidate containing the hypothesis and minimum experiment.
  produces:
    - schema_ref: schemas/evidence/experiment_plan.v1.schema.json
      purpose: Experiment design evidence.
  compatible_with:
    - cap.research-experiment-run
    - cap.research-experiment-monitor
    - cap.research-claim-verify
  incompatible_with: []
  requires_after: []
effects:
  read:
    - claims, ideas, methods, and code mapping evidence
    - schemas/evidence/experiment_plan.v1.schema.json
  write:
    - artifacts/scientific/experiment_plan/
  execute:
    - plugins/autosci/operators/scientific_lifecycle/action/experiment.py
  network:
    - none by default
  cost:
    - bounded planning cost
  risk:
    - incomplete plans can lead to unsafe or uninterpretable execution
bindings:
  skills:
    required: []
    optional:
      - autosci.experiment_design
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/experiment_plan.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against experiment_plan.v1.schema.json.
    - Confirm approval_required and expected_artifacts are explicit.
  external_verifier:
    required: true
  pass_conditions:
    - Experiment design emits valid experiment_plan.v1 evidence.
    - Execution scope and approval need are visible before any run node.
operator_compatibility:
  preferred:
    - experiment_design_worker
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: phase2_autosci_solar_native_capsules
implementation:
  trust_class: evidence_transform
  entrypoint: plugins.autosci.operators.scientific_lifecycle.action.experiment:design_experiment
  required_services: []
