capability_capsule_id: cap.research-graph-update
capsule_kind: capability
metadata:
  name: Scientific Graph Update
  description: Propose or apply typed scientific relationship edges with explicit evidence support.
applicability:
  task_types:
    - scientific-research
    - research-graph
  positive_signals:
    - update citation graph
    - add research relationship
    - build concept graph
  negative_signals:
    - draft report
    - run experiment
contract:
  inputs:
    required:
      - name: entity_refs
        description: Source and target entity identifiers.
    optional:
      - name: relation_policy
        description: Allowed relation families and write policy.
  outputs:
    required:
      - name: research_graph_update
        schema_ref: schemas/evidence/research_graph_update.v1.schema.json
    optional:
      - name: rejected_edges
        description: Edges rejected for missing evidence or invalid relation types.
  preconditions:
    - check: entity_refs_present
      description: Source and target entities are named and attributable.
  postconditions:
    - check: edges_evidenced
      description: Every graph edge has operation, relation, and evidence ids.
  invariants:
    - Does not infer graph edges without evidence ids or explicit provisional status.
composition:
  consumes:
    - schema_ref: schemas/evidence/research_paper.v1.schema.json
      purpose: Paper and citation evidence.
    - schema_ref: schemas/evidence/research_method.v1.schema.json
      purpose: Method relationship evidence.
  produces:
    - schema_ref: schemas/evidence/research_graph_update.v1.schema.json
      purpose: Graph edge delta evidence.
  compatible_with:
    - cap.research-memory-update
    - cap.research-paper-analyze
  incompatible_with: []
  requires_after: []
effects:
  read:
    - research memory graph files
    - schemas/evidence/research_graph_update.v1.schema.json
  write:
    - artifacts/scientific/research_graph_update/
    - optional research graph files when write_policy permits
  execute:
    - plugins/autosci/bin/autosci_bridge.py
  network:
    - none by default
  cost:
    - bounded local graph update cost
  risk:
    - unsupported graph edges can mislead later retrieval
bindings:
  skills:
    required: []
    optional:
      - autosci.graph_update
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/research_graph_update.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against research_graph_update.v1.schema.json.
    - Confirm each edge records source, target, relation, operation, and evidence ids.
  external_verifier:
    required: true
  pass_conditions:
    - Fixture graph update emits valid edge delta evidence.
    - Missing evidence produces inconclusive or failed status rather than silent graph mutation.
operator_compatibility:
  preferred:
    - ScientificGraphUpdater
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: phase2_autosci_solar_native_capsules
