capability_capsule_id: cap.research-literature-discover
capsule_kind: capability
metadata:
  name: Scientific Literature Discover
  description: Produce a ranked and reviewable scientific paper shortlist together with an explicit study protocol covering search strategy, source selection, time range, inclusion, exclusion, and unresolved fields.
applicability:
  task_types:
    - scientific-research
    - literature-discovery
  positive_signals:
    - discover papers
    - arxiv recommendations
    - literature shortlist
  negative_signals:
    - mutate wiki
    - verify claims
contract:
  inputs:
    required:
      - name: discovery_query
        description: Topic, anchors, venue window, or seed papers.
    optional:
      - name: ranking_policy
        description: Ranking and deduplication preferences.
  outputs:
    required:
      - name: literature_discovery
        schema_ref: schemas/evidence/literature_discovery.v1.schema.json
        description: Ranked candidates plus the explicit study_protocol used to discover and select them.
    optional:
      - name: degraded_sources
        description: Source channels that failed or returned incomplete data.
  preconditions:
    - check: query_or_seed_present
      description: Discovery has a query, seed, anchor, or venue target.
  postconditions:
    - check: shortlist_traceable
      description: Candidate ranking includes sources, rationale, and dedup status.
    - check: study_protocol_traceable
      description: Discovery records its search strategy, source-selection criteria, time range, inclusion criteria, exclusion criteria, and unresolved protocol fields.
  invariants:
    - Does not ingest selected papers directly.
    - Does not mutate durable research memory directly.
    - Missing protocol parameters remain explicitly unresolved rather than being silently invented.
composition:
  consumes:
    - schema_ref: request-envelope.schema.json
      purpose: Discovery request.
  produces:
    - schema_ref: schemas/evidence/literature_discovery.v1.schema.json
      purpose: Ranked literature candidates and the auditable study protocol used to select them.
  compatible_with:
    - cap.research-paper-ingest
    - cap.research-memory-update
  incompatible_with:
    - cap.research-experiment-run
  requires_after: []
effects:
  read:
    - optional existing research memory summaries
    - schemas/evidence/literature_discovery.v1.schema.json
  write:
    - artifacts/scientific/literature_discovery/
  execute:
    - plugins/autosci/bin/autosci_bridge.py
  network:
    - optional scientific search APIs and paper metadata feeds
  cost:
    - bounded discovery and ranking cost
  risk:
    - source APIs may be stale, unavailable, or biased
bindings:
  skills:
    required: []
    optional:
      - autosci.literature_discover
      - autosci.daily_arxiv
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/literature_discovery.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against literature_discovery.v1.schema.json.
    - Confirm candidates include source channels, ranking rationale, and dedup status.
    - Confirm outputs.study_protocol records all systematic-review protocol fields and identifies unresolved values.
  external_verifier:
    required: false
  pass_conditions:
    - Fixture discovery emits at least one candidate or an explicit inconclusive status with limitations.
    - The discovery artifact always carries a study_protocol, including when provider discovery is inconclusive.
    - No memory or ingestion artifact is created by this capsule alone.
operator_compatibility:
  preferred:
    - autosci-literature-discover-worker
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: phase2_autosci_solar_native_capsules
