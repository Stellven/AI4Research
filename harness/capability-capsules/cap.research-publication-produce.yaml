capability_capsule_id: cap.research-publication-produce
capsule_kind: capability
metadata:
  name: Scientific Publication Produce
  description: Produce publication bundles such as papers, posters, rebuttals, slides, or supplements from report evidence.
applicability:
  task_types:
    - scientific-research
    - publication-production
  positive_signals:
    - produce publication
    - compile paper
    - create poster
    - write rebuttal
  negative_signals:
    - extract claims
    - run experiment
contract:
  inputs:
    required:
      - name: requirement_ir
        type: controller_input
        description: Accepted requirements, including the exact table-like delivery manifest when named files were requested.
      - name: scientific_report
        schema_ref: schemas/evidence/scientific_report.v1.schema.json
    optional:
      - name: publication_target
        description: Paper, poster, rebuttal, slides, supplement, or mixed bundle.
      - name: final_artifact_review
        schema_ref: schemas/evidence/artifact_review.v1.schema.json
        description: Optional post-draft review of this exact scientific_report; when supplied, its blocking verdict is enforced.
  outputs:
    required:
      - name: publication_bundle
        schema_ref: schemas/evidence/publication_bundle.v1.schema.json
    optional:
      - name: build_logs
        description: Compile, render, or export logs as artifacts.
  preconditions:
    - check: report_evidence_available
      description: Source report evidence exists and unsupported claims are explicit.
    - check: delivery_manifest_available
      description: When the user requested named files, RequirementIR carries one row per exact file with format and content requirements.
  postconditions:
    - check: bundle_manifest_emitted
      description: Every required delivery-manifest row is materialized, hash-recorded, and represented exactly once in the publication bundle.
    - check: machine_evidence_bound
      description: Citation spans come from verified upstream claim coordinates, and artifact hashes are computed by the deterministic materializer after file creation rather than authored by the semantic model.
  invariants:
    - Publication output remains traceable to report and evidence ids.
    - Named deliverables are neither collapsed into one generic report nor satisfied by empty placeholder files.
    - A research run manifest records actual hashes for the other materialized files; its own final byte hash is recorded by the outer publication bundle to avoid a false self-referential digest.
    - A research run manifest binds node statuses from a Scheduler-owned runtime execution snapshot captured at publication dispatch; frozen graph definitions never stand in for execution state.
    - Publication evaluation and Scheduler Closure occur after materialization, so the manifest records those outcomes as pending and never predicts a pass or failure. The final user-facing status comes from the later gate and closure records.
    - A pre-draft report-plan review is not interpreted as approval or rejection of the final report.
    - A research run manifest that declares a failed Evidence Gate or lists failed gates cannot pass publication or close the run as completed.
composition:
  consumes:
    - type: requirement_ir.v1
      purpose: Exact output root, file set, formats, and per-file requirements accepted before planning.
    - schema_ref: schemas/evidence/scientific_report.v1.schema.json
      purpose: Source report or paper draft evidence.
  produces:
    - schema_ref: schemas/evidence/publication_bundle.v1.schema.json
      purpose: Publication bundle evidence.
  compatible_with:
    - cap.research-artifact-review
  incompatible_with:
    - cap.research-experiment-run
  requires_after: []
effects:
  read:
    - report artifacts and source evidence
    - schemas/evidence/publication_bundle.v1.schema.json
  write:
    - artifacts/scientific/publication_bundle/
    - optional build outputs
  execute:
    - plugins/autosci/bin/autosci_bridge.py
  network:
    - none by default
  cost:
    - bounded render and compile cost
  risk:
    - publication artifacts can hide unsupported claims if source report is weak
bindings:
  skills:
    required: []
    optional:
      - autosci.publication_produce
      - autosci.poster
      - autosci.rebuttal
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/publication_bundle.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against publication_bundle.v1.schema.json.
    - Confirm bundle files point back to source_report_id and evidence ids.
    - Confirm the emitted file set exactly matches delivery_manifest and every file is non-empty, format-valid, and hash-bound.
  external_verifier:
    required: true
  pass_conditions:
    - Fixture bundle emits valid publication_bundle.v1 evidence.
    - Missing, extra, malformed, empty, or renamed required outputs produce failed evidence.
    - The research run manifest records observed node states and marks the later Evidence Gate and Scheduler Closure as pending; deterministic evaluation and closure records supply their final outcomes.
operator_compatibility:
  preferred:
    - autosci-publication-compile-worker
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: phase2_autosci_solar_native_capsules
