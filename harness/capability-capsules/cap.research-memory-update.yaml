capability_capsule_id: cap.research-memory-update
capsule_kind: capability
metadata:
  name: Scientific Memory Update
  description: Propose or apply grounded research memory changes with explicit evidence and file-level traceability.
applicability:
  task_types:
    - scientific-research
    - research-memory
  positive_signals:
    - update research memory
    - crystallize answer
    - edit scientific wiki
  negative_signals:
    - run experiment
    - produce publication bundle
contract:
  inputs:
    required:
      - name: evidence_refs
        description: Evidence artifacts justifying the memory update.
    optional:
      - name: write_policy
        description: Proposal-only, apply, or human-approved write policy.
  outputs:
    required:
      - name: research_memory_update
        schema_ref: schemas/evidence/research_memory_update.v1.schema.json
    optional:
      - name: file_delta
        description: Paths proposed or changed by the memory update.
  preconditions:
    - check: evidence_refs_present
      description: Memory updates cite source evidence or are explicitly provisional.
  postconditions:
    - check: update_traceable
      description: Every changed entity has operation, path, and evidence ids.
  invariants:
    - Does not treat unsupported notes as verified paper evidence.
    - Destructive updates require explicit approval outside this capsule.
composition:
  consumes:
    - schema_ref: schemas/evidence/research_paper.v1.schema.json
      purpose: Grounded source evidence.
    - schema_ref: schemas/evidence/scientific_report.v1.schema.json
      purpose: Optional crystallized synthesis.
  produces:
    - schema_ref: schemas/evidence/research_memory_update.v1.schema.json
      purpose: Memory update evidence.
  compatible_with:
    - cap.research-graph-update
    - cap.research-paper-ingest
  incompatible_with: []
  requires_after: []
effects:
  read:
    - research memory files
    - schemas/evidence/research_memory_update.v1.schema.json
  write:
    - artifacts/scientific/research_memory_update/
    - optional research memory files when write_policy permits
  execute:
    - plugins/autosci/bin/autosci_bridge.py
  network:
    - none by default
  cost:
    - bounded local memory update cost
  risk:
    - incorrect writeback can contaminate research memory
bindings:
  skills:
    required: []
    optional:
      - autosci.memory_update
      - autosci.edit
  mcp_capabilities: {}
  data_refs:
    - schemas/evidence/research_memory_update.v1.schema.json
  secret_refs: []
verification:
  self_check:
    - Validate emitted evidence against research_memory_update.v1.schema.json.
    - Confirm every change has operation, path, and evidence ids.
  external_verifier:
    required: true
  pass_conditions:
    - Fixture update distinguishes proposed, created, updated, deleted, and no-op changes.
    - Provisional memory is not presented as verified evidence.
operator_compatibility:
  preferred:
    - autosci-memory-update-worker
  forbidden:
    - BackendFullWorkflowRunner
provenance:
  owner: opensolar
  source_phase: phase2_autosci_solar_native_capsules
